server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name taskboard.camozeroday.dev;

    ssl_certificate     /etc/letsencrypt/live/taskboard.camozeroday.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskboard.camozeroday.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ACME renewal challenges (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 30M;

    location / {
        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/(index|login|admin)\.html$ {
        proxy_pass         http://127.0.0.1:5050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        add_header         Cache-Control     "no-store" always;
    }

    access_log /var/log/nginx/taskboard.camozeroday.dev_access.log;
    error_log  /var/log/nginx/taskboard.camozeroday.dev_error.log;
}
