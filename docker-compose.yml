# Taskboard — single-container deployment.
#
#   1. Generate a secret key:   echo "TASKBOARD_SECRET_KEY=$(openssl rand -hex 32)" > .env
#   2. Bring it up:             docker compose up -d
#   3. First admin password:    docker compose logs taskboard | grep -A1 'admin user'
#   4. Visit:                   http://localhost:8083
#
# Data persists in the named volume `taskboard-data`. Back it up with:
#   docker run --rm -v taskboard-data:/data -v "$PWD":/backup alpine \
#       tar czf /backup/taskboard-$(date +%F).tgz -C /data .

services:
  taskboard:
    build: .
    image: taskboard:latest
    container_name: taskboard
    restart: unless-stopped
    ports:
      - "8083:5050"
    environment:
      - TASKBOARD_SECRET_KEY=${TASKBOARD_SECRET_KEY:?set TASKBOARD_SECRET_KEY in .env (openssl rand -hex 32)}
      - TASKBOARD_SESSION_DAYS=${TASKBOARD_SESSION_DAYS:-30}
      - TASKBOARD_MAX_UPLOAD_BYTES=${TASKBOARD_MAX_UPLOAD_BYTES:-26214400}
    volumes:
      - taskboard-data:/var/lib/taskboard
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5050/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  taskboard-data:
