name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Lint + Test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Ruff
        run: ruff check backend

      - name: Pytest
        run: pytest

  frontend:
    name: HTML sanity (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTML structure check
        run: |
          test -f frontend/index.html
          # Confirm key wiring is present
          grep -q "fetchServerData" frontend/index.html
          grep -q "Attachments" frontend/index.html
          grep -q "BackupsModal" frontend/index.html
          # Tag balance sanity (cheap heuristic)
          opens=$(grep -oE "<[a-zA-Z]+" frontend/index.html | wc -l)
          closes=$(grep -oE "</[a-zA-Z]+" frontend/index.html | wc -l)
          echo "opens=$opens closes=$closes"
