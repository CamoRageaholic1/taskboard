name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Lint + Test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Ruff
        run: ruff check backend

      - name: Pytest
        run: pytest

  frontend:
    name: HTML sanity (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTML files present
        run: |
          test -f frontend/index.html
          test -f frontend/login.html
          test -f frontend/admin.html

      - name: index.html wiring
        run: |
          for needle in fetchServerData fetchSession Attachments BackupsModal handleLogout NotesView NoteCard "Daily Notes" marked.min.js searchResults "/api/search" CalendarFeedModal "/api/feed/token"; do
            grep -q "$needle" frontend/index.html || { echo "missing: $needle"; exit 1; }
          done

      - name: login.html wiring
        run: |
          grep -q "/api/session" frontend/login.html
          grep -q 'name="username"' frontend/login.html
          grep -q 'name="password"' frontend/login.html

      - name: admin.html wiring
        run: |
          for needle in /api/users /api/admin/stats autoPassword loadUsers; do
            grep -q "$needle" frontend/admin.html || { echo "missing: $needle"; exit 1; }
          done

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: taskboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (start container, hit /api/health)
        run: |
          docker run -d --name tb -p 5050:5050 \
            -e TASKBOARD_SECRET_KEY=$(openssl rand -hex 32) \
            taskboard:ci
          # Give bootstrap a moment, then poll
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5050/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5050/api/health
          # Confirm static is being served
          curl -fsS http://127.0.0.1:5050/login.html >/dev/null
          # Confirm bootstrap printed the admin password
          docker logs tb 2>&1 | grep -E 'admin user|password:' || { echo "bootstrap output missing"; docker logs tb; exit 1; }
          docker rm -f tb
