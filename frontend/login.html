<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Taskboard — Sign in</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taskboard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<script>
  // Apply the user's last theme from the main app BEFORE first paint to avoid a flash.
  // Storage key matches index.html (THEME_KEY = 'task-board-theme').
  (function () {
    try {
      var t = localStorage.getItem('task-board-theme');
      if (t === 'light' || t === 'dark' || t === 'neon') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) { /* fall back to OS preference */ }
  })();
</script>
<style>
  /* Light (default) */
  :root {
    --bg: #f6f4ef; --surface: #fbfaf6; --border: #e2ddd0;
    --ink: #1c1b18; --ink-2: #4a4842; --ink-3: #807c70;
    --accent: #c1542a; --accent-fg: #ffffff; --danger: #b04030;
  }
  /* OS dark only when no explicit pick */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #14130f; --surface: #1c1b17; --border: #2e2c26;
      --ink: #f1ede1; --ink-2: #c5c0b1; --ink-3: #8a8676;
      --accent: #e87a4a; --accent-fg: #ffffff; --danger: #d96050;
    }
  }
  [data-theme="dark"] {
    --bg: #14130f; --surface: #1c1b17; --border: #2e2c26;
    --ink: #f1ede1; --ink-2: #c5c0b1; --ink-3: #8a8676;
    --accent: #e87a4a; --accent-fg: #ffffff; --danger: #d96050;
  }
  [data-theme="neon"] {
    --bg: #0a0a0a; --surface: #121211; --border: #1f2a1f;
    --ink: #e8ffe8; --ink-2: #a8d8a8; --ink-3: #6a7d68;
    --accent: #39ff14; --accent-fg: #001a00; --danger: #ff2a6d;
  }
  [data-theme="neon"] .card {
    box-shadow: 0 12px 32px rgba(0,0,0,0.7), 0 0 28px rgba(57,255,20,0.10);
  }
  [data-theme="neon"] button { color: var(--accent-fg); }
  /* Theme cycle button — tucked in the top-right */
  .theme-toggle {
    position: fixed; top: 16px; right: 16px;
    background: transparent; border: 1px solid var(--border); color: var(--ink-2);
    padding: 6px 8px; border-radius: 6px; cursor: pointer; line-height: 0;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .theme-toggle svg { width: 14px; height: 14px; display: block; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  h1 .mark { color: var(--accent); margin-right: 2px; }
  .sub { color: var(--ink-3); font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    min-height: 1.2em;
  }
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cycle theme" title="Cycle theme"></button>
<div class="card">
  <h1><span class="mark">·</span>Taskboard</h1>
  <div class="sub">Sign in to continue</div>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" required/>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required/>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e"></div>
  </form>
  <form id="totpForm" style="display:none">
    <label for="t">6-digit code from your authenticator app</label>
    <input id="t" name="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="8" required/>
    <button id="tb" type="submit">Verify</button>
    <div class="err" id="te"></div>
  </form>
</div>
<script>
  // Theme toggle — cycles light → dark → electric, stored at the same key as the main app
  (function () {
    const THEMES = ['light', 'dark', 'neon'];
    const LABELS = { light: 'Light', dark: 'Dark', neon: 'Electric' };
    const ICON_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    const ICON_ZAP  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
    const btn = document.getElementById('theme-toggle');
    function current() { return document.documentElement.getAttribute('data-theme') || 'light'; }
    function paint() {
      const cur = current();
      const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
      btn.innerHTML = next === 'dark' ? ICON_MOON : next === 'neon' ? ICON_ZAP : ICON_SUN;
      btn.title = `Theme: ${LABELS[cur]} → ${LABELS[next]}`;
    }
    btn.addEventListener('click', () => {
      const next = THEMES[(THEMES.indexOf(current()) + 1) % THEMES.length];
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('task-board-theme', next); } catch (e) {}
      paint();
    });
    paint();
  })();

  const form = document.getElementById('f');
  const err = document.getElementById('e');
  const btn = document.getElementById('b');

  // If already logged in, skip the form
  fetch('/api/session').then(r => r.json()).then(j => {
    if (j.authenticated) location.replace(j.role === 'admin' ? '/' : '/');
  }).catch(() => {});

  const totpForm = document.getElementById('totpForm');
  const te = document.getElementById('te');
  const tb = document.getElementById('tb');
  const showTotpStep = () => {
    form.style.display = 'none';
    totpForm.style.display = '';
    document.getElementById('t').focus();
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/api/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value }),
      });
      const j = await r.json();
      if (!r.ok) {
        err.textContent = j.error || 'Sign in failed';
      } else if (j.requires_totp) {
        showTotpStep();
      } else {
        location.replace('/');
      }
    } catch (ex) {
      err.textContent = 'Network error';
    } finally {
      btn.disabled = false;
    }
  });

  totpForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    te.textContent = '';
    tb.disabled = true;
    try {
      const r = await fetch('/api/session/totp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: totpForm.code.value.trim() }),
      });
      const j = await r.json();
      if (!r.ok) {
        te.textContent = j.error || 'Invalid code';
      } else {
        location.replace('/');
      }
    } catch (ex) {
      te.textContent = 'Network error';
    } finally {
      tb.disabled = false;
    }
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch(() => {});
    });
  }
</script>
</body>
</html>
