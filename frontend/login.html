<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taskboard — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #fbfaf6;
    --border: #e2ddd0;
    --ink: #1c1b18;
    --ink-2: #4a4842;
    --ink-3: #807c70;
    --accent: #c1542a;
    --danger: #b04030;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f; --surface: #1c1b17; --border: #2e2c26;
      --ink: #f1ede1; --ink-2: #c5c0b1; --ink-3: #8a8676;
      --accent: #e87a4a; --danger: #d96050;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  h1 .mark { color: var(--accent); margin-right: 2px; }
  .sub { color: var(--ink-3); font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    min-height: 1.2em;
  }
</style>
</head>
<body>
<div class="card">
  <h1><span class="mark">·</span>Taskboard</h1>
  <div class="sub">Sign in to continue</div>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" required/>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required/>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e"></div>
  </form>
</div>
<script>
  const form = document.getElementById('f');
  const err = document.getElementById('e');
  const btn = document.getElementById('b');

  // If already logged in, skip the form
  fetch('/api/session').then(r => r.json()).then(j => {
    if (j.authenticated) location.replace(j.role === 'admin' ? '/' : '/');
  }).catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/api/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value }),
      });
      const j = await r.json();
      if (!r.ok) {
        err.textContent = j.error || 'Sign in failed';
      } else {
        location.replace('/');
      }
    } catch (ex) {
      err.textContent = 'Network error';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
