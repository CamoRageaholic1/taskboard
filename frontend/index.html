<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #fbfaf6;
    --surface-2: #efece4;
    --border: #e2ddd0;
    --border-strong: #c9c2b0;
    --ink: #1c1b18;
    --ink-2: #4a4842;
    --ink-3: #807c70;
    --ink-4: #b3ac9c;
    --accent: #c1542a;
    --accent-soft: #e8a682;
    --accent-bg: #f5e2d4;
    --danger: #b04030;
    --success: #5c7a3a;
    --warning: #b88820;
    --shadow-sm: 0 1px 0 rgba(28,27,24,0.04), 0 1px 2px rgba(28,27,24,0.04);
    --shadow-md: 0 4px 12px rgba(28,27,24,0.06), 0 1px 3px rgba(28,27,24,0.04);
    --shadow-lg: 0 12px 32px rgba(28,27,24,0.10), 0 2px 6px rgba(28,27,24,0.05);
  }
  [data-theme="dark"] {
    --bg: #14130f;
    --surface: #1c1b17;
    --surface-2: #25241f;
    --border: #2e2c26;
    --border-strong: #43413a;
    --ink: #f1ede1;
    --ink-2: #c5c0b1;
    --ink-3: #8a8676;
    --ink-4: #5a5749;
    --accent: #e87a4a;
    --accent-soft: #c1542a;
    --accent-bg: #38221a;
    --danger: #d96050;
    --success: #8aa860;
    --warning: #d9a840;
    --shadow-sm: 0 1px 0 rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100vh;
    width: 100vw;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand-mark {
    color: var(--accent);
    margin-right: 2px;
  }
  .theme-toggle {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink-2);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.15s;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--border-strong); }

  .sidebar-section {
    padding: 16px 12px 4px;
    flex-shrink: 0;
  }
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    padding: 4px 8px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-label .count {
    color: var(--ink-4);
    font-weight: 400;
  }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px;
    min-height: 0;
  }
  .sidebar-list::-webkit-scrollbar { width: 6px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 13px;
    font-weight: 500;
    transition: background 0.12s;
    user-select: none;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active { background: var(--surface-2); color: var(--ink); }
  .nav-item.active .nav-dot { background: var(--accent); }
  .nav-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-4);
    flex-shrink: 0;
  }
  .nav-item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
  }

  .project-item {
    position: relative;
  }
  .project-item .project-actions {
    opacity: 0;
    display: flex;
    gap: 2px;
    transition: opacity 0.15s;
  }
  .project-item:hover .project-actions { opacity: 1; }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--ink-3);
    width: 22px; height: 22px;
    border-radius: 5px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.12s;
  }
  .icon-btn:hover { background: var(--border); color: var(--ink); }

  .add-project {
    margin: 4px 0 12px;
    padding: 8px 10px;
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    background: transparent;
    color: var(--ink-3);
    font-family: inherit;
    font-size: 13px;
    width: calc(100% - 24px);
    margin-left: 12px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .add-project:hover { color: var(--ink); border-color: var(--ink-3); background: var(--surface-2); }

  .sidebar-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-4);
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-footer .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
    display: inline-block;
    margin-right: 6px;
    box-shadow: 0 0 0 2px var(--surface);
  }

  /* ---------- Main ---------- */
  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .main-header {
    padding: 24px 40px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-shrink: 0;
  }
  .header-left { min-width: 0; flex: 1; }
  .breadcrumb {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .project-title-input {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    letter-spacing: -0.02em;
    color: var(--ink);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    padding: 0;
    line-height: 1.2;
  }
  .project-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
  }
  .meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .meta-pill strong { color: var(--ink); font-weight: 500; }

  .header-right {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { border-color: var(--border-strong); }
  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
  [data-theme="dark"] .btn-primary {
    background: var(--accent); border-color: var(--accent); color: #1a0e08;
  }
  [data-theme="dark"] .btn-primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    padding: 14px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    background: var(--bg);
  }
  .filter-tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 6px 10px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink-3);
    cursor: pointer;
    transition: all 0.12s;
  }
  .filter-tab:hover { color: var(--ink-2); }
  .filter-tab.active { color: var(--ink); background: var(--surface-2); border-color: var(--border); }
  .filter-tab .num { color: var(--ink-4); margin-left: 6px; }
  .filter-tab.active .num { color: var(--accent); }
  .toolbar-spacer { flex: 1; }
  .search-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    width: 200px;
    transition: all 0.15s;
  }
  .search-input::placeholder { color: var(--ink-4); }
  .search-input:focus { outline: none; border-color: var(--ink-3); }

  /* ---------- Task List ---------- */
  .task-canvas {
    flex: 1;
    overflow-y: auto;
    padding: 24px 40px 80px;
    min-height: 0;
  }
  .task-canvas::-webkit-scrollbar { width: 8px; }
  .task-canvas::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-3);
  }
  .empty-state h3 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 22px;
    color: var(--ink-2);
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 13px;
    margin-bottom: 20px;
  }

  .task {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    transition: all 0.18s;
    overflow: hidden;
  }
  .task:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .task.completed { opacity: 0.55; }
  .task.completed .task-title { text-decoration: line-through; color: var(--ink-3); }
  .task.expanded { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

  .task-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .task-checkbox {
    width: 20px; height: 20px;
    border: 1.5px solid var(--ink-4);
    border-radius: 6px;
    flex-shrink: 0;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.15s;
    background: transparent;
  }
  .task-checkbox:hover { border-color: var(--ink-2); }
  .task-checkbox.checked {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  [data-theme="dark"] .task-checkbox.checked {
    background: var(--accent); border-color: var(--accent); color: #1a0e08;
  }
  .task-checkbox.checked svg { display: block; }
  .task-checkbox svg { display: none; width: 12px; height: 12px; }

  .task-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .task-title {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.4;
  }
  .task-title-input {
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    padding: 0;
  }
  .task-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .task-meta-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .task-meta-item.overdue { color: var(--danger); }
  .task-meta-item.due-soon { color: var(--warning); }
  .task-meta-item.completed-meta { color: var(--success); }

  .priority-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .priority-high { background: var(--danger); }
  .priority-med { background: var(--warning); }
  .priority-low { background: var(--ink-4); }

  .task-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .task:hover .task-actions, .task.expanded .task-actions { opacity: 1; }

  .expand-chevron {
    color: var(--ink-3);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .task.expanded .expand-chevron { transform: rotate(90deg); }

  /* ---------- Task expanded body ---------- */
  .task-body {
    border-top: 1px solid var(--border);
    padding: 16px 16px 18px 50px;
    display: none;
    background: var(--surface);
  }
  .task.expanded .task-body { display: block; }

  .body-section {
    margin-bottom: 18px;
  }
  .body-section:last-child { margin-bottom: 0; }
  .body-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    margin-bottom: 8px;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .field {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .field input, .field select {
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
  }
  .field input[type="date"] { min-width: 120px; }
  .field-icon { color: var(--ink-3); }

  .description-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    resize: vertical;
    min-height: 60px;
    line-height: 1.5;
    transition: border-color 0.15s;
  }
  .description-textarea:focus { outline: none; border-color: var(--ink-3); }
  .description-textarea::placeholder { color: var(--ink-4); }

  /* Subtasks */
  .subtask-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .subtask {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 6px;
    transition: background 0.12s;
  }
  .subtask:hover { background: var(--bg); }
  .subtask-checkbox {
    width: 16px; height: 16px;
    border: 1.5px solid var(--ink-4);
    border-radius: 4px;
    flex-shrink: 0;
    cursor: pointer;
    display: grid;
    place-items: center;
    background: transparent;
  }
  .subtask-checkbox.checked {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  [data-theme="dark"] .subtask-checkbox.checked {
    background: var(--accent); border-color: var(--accent); color: #1a0e08;
  }
  .subtask-checkbox svg { display: none; width: 10px; height: 10px; }
  .subtask-checkbox.checked svg { display: block; }
  .subtask-input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    padding: 2px 0;
  }
  .subtask.checked .subtask-input { text-decoration: line-through; color: var(--ink-3); }
  .subtask-delete {
    opacity: 0;
    transition: opacity 0.12s;
  }
  .subtask:hover .subtask-delete { opacity: 1; }

  .add-subtask {
    background: transparent;
    border: none;
    color: var(--ink-3);
    font-family: inherit;
    font-size: 12.5px;
    padding: 6px 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 6px;
    margin-top: 4px;
  }
  .add-subtask:hover { color: var(--ink); background: var(--bg); }

  .subtask-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .progress-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    flex-shrink: 0;
  }

  /* Add task input */
  .add-task-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .add-task-row:focus-within { border-color: var(--ink-3); border-style: solid; }
  .add-task-row .placeholder-circle {
    width: 20px; height: 20px;
    border: 1.5px dashed var(--ink-4);
    border-radius: 6px;
    flex-shrink: 0;
  }
  .add-task-input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    padding: 0;
  }
  .add-task-input::placeholder { color: var(--ink-4); }

  /* Group headers */
  .task-group-header {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-3);
    margin: 22px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .task-group-header:first-child { margin-top: 0; }
  .task-group-header.urgent { color: var(--danger); }

  /* Modal-style confirm */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Command palette */
  .palette-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 19, 15, 0.4);
    backdrop-filter: blur(2px);
    display: grid;
    place-items: start center;
    padding-top: 12vh;
    z-index: 200;
    animation: fadeIn 0.12s ease;
  }
  [data-theme="dark"] .palette-overlay { background: rgba(0,0,0,0.55); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .palette {
    width: 560px;
    max-width: 92vw;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .palette-input {
    width: 100%;
    padding: 16px 20px;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    outline: none;
  }
  .palette-input::placeholder { color: var(--ink-4); }
  .palette-results {
    max-height: 360px;
    overflow-y: auto;
    padding: 6px;
  }
  .palette-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 13.5px;
  }
  .palette-item.selected { background: var(--surface-2); color: var(--ink); }
  .palette-item .item-kind {
    font-family: 'IBM Plex Mono', monospace;

function formatDueDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return { label: 'Today', state: 'due-soon' };
  if (diff === 1) return { label: 'Tomorrow', state: 'due-soon' };
  if (diff === -1) return { label: 'Yesterday', state: 'overdue' };
  if (diff < 0) return { label: `${Math.abs(diff)}d overdue`, state: 'overdue' };
  if (diff < 7) return { label: `In ${diff}d`, state: diff <= 2 ? 'due-soon' : '' };
  const opts = { month: 'short', day: 'numeric' };
  return { label: d.toLocaleDateString(undefined, opts), state: '' };
}

// ---------- Recurrence ----------
const RECUR_OPTIONS = [
  { value: 'none', label: 'Does not repeat' },
  { value: 'daily', label: 'Daily' },
  { value: 'weekdays', label: 'Weekdays (Mon-Fri)' },
  { value: 'weekly', label: 'Weekly' },
  { value: 'biweekly', label: 'Every 2 weeks' },
  { value: 'monthly', label: 'Monthly' },
  { value: 'yearly', label: 'Yearly' },
];
function nextRecurrence(dateStr, rule) {
  if (!rule || rule === 'none') return '';
  const base = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  const d = new Date(base);
  if (rule === 'daily') d.setDate(d.getDate() + 1);
  else if (rule === 'weekdays') {
    do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
  }
  else if (rule === 'weekly') d.setDate(d.getDate() + 7);
  else if (rule === 'biweekly') d.setDate(d.getDate() + 14);
  else if (rule === 'monthly') d.setMonth(d.getMonth() + 1);
  else if (rule === 'yearly') d.setFullYear(d.getFullYear() + 1);
  // If past, keep advancing until future
  const today = new Date(); today.setHours(0,0,0,0);
  let safety = 0;
  while (d < today && safety++ < 365) {
    if (rule === 'daily') d.setDate(d.getDate() + 1);
    else if (rule === 'weekdays') { do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6); }
    else if (rule === 'weekly') d.setDate(d.getDate() + 7);
    else if (rule === 'biweekly') d.setDate(d.getDate() + 14);
    else if (rule === 'monthly') d.setMonth(d.getMonth() + 1);
    else if (rule === 'yearly') d.setFullYear(d.getFullYear() + 1);
  }
  return d.toISOString().slice(0, 10);
}
function recurLabel(rule) {
  const o = RECUR_OPTIONS.find(r => r.value === rule);
  return o ? o.label : '';

    list.push({ kind: 'action', id: 'a-snapshot', label: 'Save snapshot to server', hint: 'Action', action: { type: 'snapshot' } });
    list.push({ kind: 'action', id: 'a-restore', label: 'Browse server snapshots…', hint: 'Action', action: { type: 'restore' } });
    list.push({ kind: 'action', id: 'a-feed', label: 'Calendar feed (iCal subscription)…', hint: 'Action', action: { type: 'feed' } });
    list.push({ kind: 'action', id: 'a-theme', label: 'Toggle dark mode', hint: 'Action', action: { type: 'theme' } });

    let local = q ? list.filter(i => i.label.toLowerCase().includes(q)) : list;

    // Append server search hits (tasks / subtasks / notes / projects matched by content)
    const serverHits = searchResults.map(h => {
      if (h.kind === 'task') {
        return { kind: 'task', id: 't-' + h.id, label: h.title,
                 hint: `Task · ${h.project_name}${h.completed ? ' · done' : ''}`,
                 snippet: h.snippet,
                 action: { type: 'task', id: h.id, projectId: h.project_id } };
      }
      if (h.kind === 'subtask') {
        return { kind: 'subtask', id: 's-' + h.id, label: h.title,
                 hint: `Subtask · ${h.parent_title}`,
                 action: { type: 'task', id: h.task_id, projectId: h.project_id } };
      }
      if (h.kind === 'note') {
        return { kind: 'note', id: 'n-' + h.id, label: h.title,
                 hint: `Note · ${h.date}`, snippet: h.snippet,
                 action: { type: 'note', id: h.id, date: h.date } };
      }
      if (h.kind === 'project') {
        return { kind: 'project', id: 'pr-' + h.id, label: h.title,
                 hint: 'Project (matched)',
                 action: { type: 'project', id: h.id } };
      }
      return null;
    }).filter(Boolean);

    return [...local, ...serverHits];
  }, [query, data, searchResults]);

  useEffect(() => { setSelected(0); }, [query]);

  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSelected(s => Math.min(s + 1, items.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSelected(s => Math.max(s - 1, 0)); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const item = items[selected];
      if (item) onAction(item.action);
    }
    else if (e.key === 'Escape') { e.preventDefault(); onClose(); }
  };

  return (
    <div className="palette-overlay" onClick={onClose}>
      <div className="palette" onClick={(e) => e.stopPropagation()}>
        <input
          ref={inputRef}
          className="palette-input"
          placeholder="Jump to project, view, or action…"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          onKeyDown={onKey}
        />
        <div className="palette-results">
          {items.length === 0 ? (
            <div style={{ padding: '20px', textAlign: 'center', color: 'var(--ink-3)', fontSize: 13 }}>No matches</div>
          ) : items.map((item, i) => (
            <div
              key={item.id}
              className={`palette-item ${i === selected ? 'selected' : ''}`}
              onClick={() => onAction(item.action)}
              onMouseEnter={() => setSelected(i)}
              style={{ flexDirection: item.snippet ? 'column' : 'row', alignItems: item.snippet ? 'stretch' : 'center' }}
            >
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, width: '100%' }}>
                {item.color && <span className="priority-dot" style={{ background: item.color }}/>}
                <span className="item-label">{item.label}</span>
                <span className="item-hint">{item.hint}</span>
              </div>
              {item.snippet && (
                <div style={{ color: 'var(--ink-3)', fontSize: 11.5, marginTop: 4, marginLeft: 0,
                              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {item.snippet}
                </div>
              )}
            </div>
          ))}
        </div>
        <div className="palette-footer">
          <span><kbd>↑↓</kbd>Navigate</span>
          <span><kbd>↵</kbd>Select</span>
          <span><kbd>Esc</kbd>Close</span>
        </div>
      </div>
    </div>
  );
}

function ThemeToggle({ theme, setTheme }) {
  return (
    <button className="theme-toggle" onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} title="Toggle theme" aria-label="Toggle theme">
      {theme === 'light' ? <Icon.Moon/> : <Icon.Sun/>}
    </button>

}

function Sidebar({ data, setData, theme, setTheme, totals, onExport, onImportClick, user, onLogout }) {
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState('');
  const [dragProjectId, setDragProjectId] = useState(null);
  const [dropProjectTarget, setDropProjectTarget] = useState(null);
  const renameInputRef = useRef(null);

  useEffect(() => {
    if (renamingId && renameInputRef.current) {
      renameInputRef.current.focus();
      renameInputRef.current.select();
    }
  }, [renamingId]);

  const startRename = (proj) => {
    setRenamingId(proj.id);
    setRenameVal(proj.name);
  };
  const commitRename = () => {
    if (!renamingId) return;
    const v = renameVal.trim() || 'Untitled';
    setData(d => ({
      ...d,
      projects: d.projects.map(p => p.id === renamingId ? { ...p, name: v } : p),
    }));
    setRenamingId(null);
  };
  const deleteProject = (id) => {
    if (!confirm('Delete this project and all its tasks?')) return;
    setData(d => {
      const projects = d.projects.filter(p => p.id !== id);
      const activeProjectId = d.activeProjectId === id
        ? (projects[0]?.id || null)
        : d.activeProjectId;
      return { ...d, projects, activeProjectId, activeView: 'project' };
    });
  };
  const addProject = () => {
    const colors = ['#c1542a', '#5c7a3a', '#b88820', '#6b5b8a', '#3a6e7a', '#a04060'];
    const newP = {
      id: uid(), name: 'New Project',
      color: colors[Math.floor(Math.random() * colors.length)],
      createdAt: Date.now(), tasks: [],
    };
    setData(d => ({ ...d, projects: [...d.projects, newP], activeProjectId: newP.id, activeView: 'project' }));
    setTimeout(() => startRename(newP), 50);
  };

  const setView = (v) => setData(d => ({ ...d, activeView: v }));
  const setProject = (id) => setData(d => ({ ...d, activeProjectId: id, activeView: 'project' }));

  return (
    <aside className="sidebar">
      <div className="sidebar-header">
        <div className="brand"><span className="brand-mark">◆</span> Tasks</div>
        <ThemeToggle theme={theme} setTheme={setTheme}/>
      </div>

      <div className="sidebar-section">
        <div className="section-label">Views</div>
      </div>
      <div style={{ padding: '0 12px' }}>
        <div className={`nav-item ${data.activeView === 'today' ? 'active' : ''}`} onClick={() => setView('today')}>
          <Icon.Today/>
          <span className="nav-item-label">Today</span>
          <span className="nav-item-count">{totals.today}</span>
        </div>
        <div className={`nav-item ${data.activeView === 'all' ? 'active' : ''}`} onClick={() => setView('all')}>
          <Icon.Inbox/>
          <span className="nav-item-label">All Tasks</span>
          <span className="nav-item-count">{totals.all}</span>
        </div>
        <div className={`nav-item ${data.activeView === 'notes' ? 'active' : ''}`} onClick={() => setView('notes')}>
          <Icon.Edit size={13}/>
          <span className="nav-item-label">Daily Notes</span>
        </div>
      </div>

      <div className="sidebar-section">
        <div className="section-label">
          <span>Projects</span>
          <span className="count">{data.projects.length}</span>
        </div>
      </div>
      <div className="sidebar-list">
        {data.projects.map(p => {
          const isActive = data.activeView === 'project' && data.activeProjectId === p.id;
          const open = p.tasks.filter(t => !t.completed).length;
          return (
            <div
              key={p.id}
              className={`nav-item project-item ${dragProjectId === p.id ? 'dragging' : ''} ${dropProjectTarget?.id === p.id ? 'drop-' + dropProjectTarget.where : ''}`}
              onClick={() => setProject(p.id)}
              style={isActive ? { background: 'var(--surface-2)', color: 'var(--ink)' } : {}}
              draggable={!renamingId}
              onDragStart={(e) => { setDragProjectId(p.id); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', p.id); } catch(err){} }}
              onDragOver={(e) => {
                if (!dragProjectId || dragProjectId === p.id) return;
                e.preventDefault();
                const rect = e.currentTarget.getBoundingClientRect();
                const where = (e.clientY - rect.top) < rect.height / 2 ? 'above' : 'below';
                setDropProjectTarget({ id: p.id, where });
              }}
              onDragLeave={() => setDropProjectTarget(prev => prev && prev.id === p.id ? null : prev)}
              onDrop={(e) => {
                e.preventDefault();
                if (!dragProjectId || dragProjectId === p.id) { setDropProjectTarget(null); return; }
                const where = dropProjectTarget?.where || 'above';
                setData(d => {
                  const list = [...d.projects];
                  const fromIdx = list.findIndex(x => x.id === dragProjectId);
                  if (fromIdx === -1) return d;
                  const [moved] = list.splice(fromIdx, 1);
                  let toIdx = list.findIndex(x => x.id === p.id);
                  if (toIdx === -1) toIdx = list.length;
                  if (where === 'below') toIdx += 1;
                  list.splice(toIdx, 0, moved);
                  return { ...d, projects: list };
                });
                setDragProjectId(null); setDropProjectTarget(null);
              }}
              onDragEnd={() => { setDragProjectId(null); setDropProjectTarget(null); }}
            >
              <span className="nav-dot" style={{ background: isActive ? p.color : undefined, opacity: isActive ? 1 : 0.6 }}/>
              {renamingId === p.id ? (
                <input
                  ref={renameInputRef}
                  className="rename-input"
                  value={renameVal}
                  onChange={(e) => setRenameVal(e.target.value)}
                  onBlur={commitRename}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') commitRename();
                    if (e.key === 'Escape') { setRenamingId(null); }
                  }}
                  onClick={(e) => e.stopPropagation()}
                />
              ) : (
                <>
                  <span className="nav-item-label">{p.name}</span>
                  <div className="project-actions" onClick={(e) => e.stopPropagation()}>
                    <button className="icon-btn" title="Rename" onClick={() => startRename(p)}><Icon.Edit size={11}/></button>
                    <button className="icon-btn" title="Delete" onClick={() => deleteProject(p.id)}><Icon.Trash size={11}/></button>
                  </div>
                  {!renamingId && <span className="nav-item-count">{open}</span>}
                </>
              )}
            </div>
          );
        })}
        <button className="add-project" onClick={addProject}>
          <Icon.Plus size={12}/> New project
        </button>
      </div>

      <div className="sidebar-section" style={{ padding: '8px 12px 0', flexShrink: 0 }}>
        <div style={{ display: 'flex', gap: 6, padding: '0 0 8px' }}>
          <button className="btn" style={{ flex: 1, justifyContent: 'center', fontSize: 12, padding: '7px 10px' }} onClick={onExport} title="Download a JSON backup">
            <Icon.Download size={12}/> Export
          </button>
          <button className="btn" style={{ flex: 1, justifyContent: 'center', fontSize: 12, padding: '7px 10px' }} onClick={onImportClick} title="Restore from a JSON backup">
            <Icon.Upload size={12}/> Import
          </button>
        </div>
      </div>

      <div className="sidebar-footer" style={{ flexDirection: 'column', alignItems: 'stretch', gap: 6, padding: '10px 16px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span><span className="dot"></span>{user?.username || 'GUEST'}{user?.role === 'admin' && ' · ADMIN'}</span>
          <span>v2.0</span>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 9 }}>
          {user?.role === 'admin'
            ? <a href="/admin.html" style={{ color: 'var(--ink-3)', textDecoration: 'none' }}>ADMIN PANEL</a>
            : <span/>}
          <a href="#" onClick={(e) => { e.preventDefault(); onLogout?.(); }} style={{ color: 'var(--ink-3)', textDecoration: 'none' }}>SIGN OUT</a>
        </div>
      </div>
    </aside>
  );
}
