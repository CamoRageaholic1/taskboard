function NoteCard({ note, onChange, onDelete }) {
  const [title, setTitle] = useState(note.title);
  const [body, setBody] = useState(note.body);
  const [mode, setMode] = useState('edit'); // 'edit' | 'preview'
  const saveTimer = useRef(null);
  const lastSaved = useRef({ title: note.title, body: note.body });

  useEffect(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    if (title === lastSaved.current.title && body === lastSaved.current.body) return;
    saveTimer.current = setTimeout(async () => {
      const patch = {};
      if (title !== lastSaved.current.title) patch.title = title;
      if (body !== lastSaved.current.body) patch.body = body;
      try {
        const r = await fetch(`/api/notes/${note.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
        if (r.ok) {
          lastSaved.current = { title, body };
          onChange?.(await r.json());
        }
      } catch (e) {}
    }, 400);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [title, body]);

  const rendered = useMemo(() => {
    if (typeof marked === 'undefined') return body;
    try { return marked.parse(body || '*(empty)*', { breaks: true, gfm: true, mangle: false, headerIds: false }); }
    catch (e) { return body; }
  }, [body, mode]);

  return (
    <div style={{
      background: 'var(--surface)',
      border: '1px solid var(--border)',
      borderRadius: 10,
      marginBottom: 14,
      overflow: 'hidden',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', borderBottom: '1px solid var(--border)' }}>
        <input
          value={title}
          onChange={(e) => setTitle(e.target.value)}
          placeholder="Untitled note"
          style={{
            flex: 1, background: 'transparent', border: 'none', outline: 'none',
            font: 'inherit', fontSize: 15, fontWeight: 600, color: 'var(--ink)',
          }}
        />
        <button
          className="add-subtask"
          onClick={() => setMode(mode === 'edit' ? 'preview' : 'edit')}
          style={{ padding: '4px 10px', fontSize: 11 }}
        >
          {mode === 'edit' ? 'Preview' : 'Edit'}
        </button>
        <button className="icon-btn" title="Delete note" onClick={onDelete}><Icon.Trash size={13}/></button>
      </div>
      {mode === 'edit' ? (
        <textarea
          value={body}
          onChange={(e) => setBody(e.target.value)}
          placeholder="Markdown supported — # headings, **bold**, lists, links, `code`…"
          spellCheck={false}
          style={{
            width: '100%', minHeight: 120, padding: '12px 14px',
            background: 'transparent', border: 'none', outline: 'none', resize: 'vertical',
            font: '13px "IBM Plex Mono", monospace', color: 'var(--ink)', lineHeight: 1.55,
          }}
        />
      ) : (
        <div
          className="markdown-body"
          style={{ padding: '12px 16px', fontSize: 14, color: 'var(--ink)', lineHeight: 1.55 }}
          dangerouslySetInnerHTML={{ __html: rendered }}
        />
      )}
    </div>
  );
}

function NotesView({ initialDate }) {
  const [date, setDate] = useState(initialDate || todayStr());
  const [notes, setNotes] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => { if (initialDate) setDate(initialDate); }, [initialDate]);

  const load = useCallback(async (d) => {
    setLoading(true);
    try {
      const r = await fetch(`/api/notes?date=${d}`, { cache: 'no-store' });
      if (r.status === 401) { location.replace('/login.html'); return; }
      if (r.ok) setNotes(await r.json());
    } catch (e) {}
    setLoading(false);
  }, []);

  useEffect(() => { load(date); }, [date, load]);

  const shiftDay = (delta) => {
    const d = new Date(date + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    setDate(d.toISOString().slice(0, 10));
  };

  const addNote = async () => {
    try {
      const r = await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, title: '', body: '' }),
      });
      if (r.ok) {
        const created = await r.json();
        setNotes(prev => [...prev, created]);
        setTimeout(() => {
          const cards = document.querySelectorAll('.notes-list input');
          cards[cards.length - 1]?.focus();
        }, 50);
      }
    } catch (e) {}
  };

  const removeNote = async (id) => {
    if (!confirm('Delete this note?')) return;
    try {
      const r = await fetch(`/api/notes/${id}`, { method: 'DELETE' });
      if (r.ok) setNotes(prev => prev.filter(n => n.id !== id));
    } catch (e) {}
  };

  const updateNote = (n) => setNotes(prev => prev.map(x => x.id === n.id ? n : x));

  const todayLabel = (() => {
    const t = todayStr();
    if (date === t) return 'Today';
    const y = new Date(t + 'T00:00:00'); y.setDate(y.getDate() - 1);
    if (date === y.toISOString().slice(0, 10)) return 'Yesterday';
    return new Date(date + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  })();

  return (
    <main className="main">
      <header className="main-header">
        <div className="header-left">
          <div className="breadcrumb"><Icon.Edit size={11}/> Daily Notes</div>
          <div className="project-title-input" style={{ pointerEvents: 'none' }}>
            {todayLabel} <span style={{ color: 'var(--ink-3)', fontWeight: 400, fontSize: 14 }}>· {date}</span>
          </div>
          <div className="project-meta">
            <span className="meta-pill">{notes.length} note{notes.length === 1 ? '' : 's'}</span>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button className="add-subtask" onClick={() => shiftDay(-1)}>← Prev</button>
          <button className="add-subtask" onClick={() => setDate(todayStr())}>Today</button>
          <button className="add-subtask" onClick={() => shiftDay(1)}>Next →</button>
          <input
            type="date"
            value={date}
            onChange={(e) => e.target.value && setDate(e.target.value)}
            style={{
              padding: '5px 8px', background: 'var(--surface-2)', border: '1px solid var(--border)',
              borderRadius: 6, color: 'var(--ink)', font: 'inherit', fontSize: 12,
            }}
          />
        </div>
      </header>
      <div className="main-content notes-list" style={{ padding: 24, overflowY: 'auto' }}>
        <div style={{ maxWidth: 820, margin: '0 auto' }}>
          {loading && <div style={{ color: 'var(--ink-3)', textAlign: 'center', padding: 40 }}>Loading…</div>}
          {!loading && notes.length === 0 && (
            <div style={{ color: 'var(--ink-3)', textAlign: 'center', padding: 40 }}>
              No notes for {todayLabel.toLowerCase()}. Click "+ New note" to start capturing.
            </div>
          )}
          {notes.map(n => (
            <NoteCard
              key={n.id}
              note={n}
              onChange={updateNote}
              onDelete={() => removeNote(n.id)}
            />
          ))}
          <button
            onClick={addNote}
            style={{
              width: '100%', padding: '14px',
              background: 'var(--surface-2)', border: '1px dashed var(--border-strong)',
              borderRadius: 10, cursor: 'pointer',
              color: 'var(--ink-2)', font: 'inherit', fontSize: 13,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
            }}
          >
            <Icon.Plus size={13}/> New note
          </button>
        </div>
      </div>
    </main>
  );
}

function Attachments({ taskId }) {
  const [list, setList] = useState([]);
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);
  const toast = (m) => { try { window.__taskboardToast?.(m); } catch (e) {} };

  const refresh = useCallback(async () => {
    try {
      const r = await fetch(`/api/attachments?task_id=${encodeURIComponent(taskId)}`, { cache: 'no-store' });
      if (r.ok) setList(await r.json());
    } catch (e) {}
  }, [taskId]);

  useEffect(() => { refresh(); }, [refresh]);

  const upload = async (file) => {
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) { toast('File too large (max 25 MB)'); return; }
    setUploading(true);
    const fd = new FormData();
    fd.append('file', file);
    try {
      const r = await fetch(`/api/attachments?task_id=${encodeURIComponent(taskId)}`, { method: 'POST', body: fd });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        toast(`Upload failed: ${j.error || r.status}`);
      } else {
        toast('Attached');
        refresh();
      }
    } catch (e) {
      toast('Upload failed: network error');
    } finally {
      setUploading(false);
    }
  };

  const remove = async (id) => {
    if (!confirm('Delete this attachment?')) return;
    try {
      const r = await fetch(`/api/attachments/${id}`, { method: 'DELETE' });
      if (r.ok) { toast('Removed'); refresh(); }
    } catch (e) {}
  };

  const fmtSize = (n) => {
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    return `${(n / 1024 / 1024).toFixed(1)} MB`;
  };

  return (
    <div className="body-section">
      <div className="body-label">Attachments {list.length > 0 && `· ${list.length}`}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 6 }}>
        {list.map(a => (
          <div key={a.id} style={{
            display: 'flex', alignItems: 'center', gap: 8,
            padding: '6px 10px', background: 'var(--surface-2)',
            border: '1px solid var(--border)', borderRadius: 6, fontSize: 13,
          }}>
            <a href={`/api/attachments/${a.id}`} target="_blank" rel="noreferrer"
               style={{ color: 'var(--ink)', textDecoration: 'none', flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {a.filename}
            </a>
            <span style={{ color: 'var(--ink-3)', fontSize: 11, fontFamily: 'IBM Plex Mono, monospace' }}>{fmtSize(a.size)}</span>
            <button className="icon-btn" title="Delete" onClick={() => remove(a.id)}><Icon.Trash size={12}/></button>
          </div>
        ))}
      </div>
      <input
        ref={fileInputRef}
        type="file"
        style={{ display: 'none' }}
        onChange={(e) => { const f = e.target.files?.[0]; upload(f); e.target.value = ''; }}
      />
      <button className="add-subtask" disabled={uploading} onClick={() => fileInputRef.current?.click()}>
        <Icon.Plus size={11}/> {uploading ? 'Uploading…' : 'Attach file'}
      </button>
    </div>
  );
}

function CalendarFeedModal({ onClose }) {
  const [token, setToken] = useState(null);
  const [url, setUrl] = useState('');
  const [busy, setBusy] = useState(false);
  const toast = (m) => { try { window.__taskboardToast?.(m); } catch (e) {} };

  const load = async () => {
    try {
      const r = await fetch('/api/feed/token', { cache: 'no-store' });
      if (r.ok) { const j = await r.json(); setToken(j.token); setUrl(`${location.origin}${j.url}`); }
    } catch (e) {}
  };
  useEffect(() => { load(); }, []);

  const rotate = async () => {
    if (!confirm('Rotate the feed token? Existing calendar subscriptions will stop working until you update the URL.')) return;
    setBusy(true);
    try {
      const r = await fetch('/api/feed/token', { method: 'POST' });
      if (r.ok) { const j = await r.json(); setToken(j.token); setUrl(`${location.origin}${j.url}`); toast('Rotated'); }
    } catch (e) { toast('Rotate failed'); }
    setBusy(false);
  };

  const copy = async () => {
    try { await navigator.clipboard.writeText(url); toast('Copied'); } catch (e) { toast('Copy failed'); }
  };

  return (
    <div className="palette-overlay" onClick={onClose}>
      <div className="palette" style={{ width: 600 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={{ fontWeight: 600, color: 'var(--ink)' }}>Calendar feed (iCal subscription)</div>
          <button className="icon-btn" onClick={onClose}><Icon.X size={14}/></button>
        </div>
        <div style={{ padding: '16px 18px' }}>
          <p style={{ color: 'var(--ink-2)', fontSize: 13, marginBottom: 12 }}>
            Subscribe to this URL in Google Calendar, Apple Calendar, or any iCal-compatible client.
            All your <strong>open tasks with due dates</strong> appear as all-day events. Updates poll every few minutes
            (controlled by your calendar app).
          </p>
          <div style={{
            display: 'flex', gap: 8, padding: '10px 12px',
            background: 'var(--surface-2)', border: '1px solid var(--border)',
            borderRadius: 6, marginBottom: 12,
          }}>
            <code style={{
              flex: 1, fontFamily: 'IBM Plex Mono, monospace', fontSize: 12,
              color: 'var(--ink)', wordBreak: 'break-all', userSelect: 'all',
            }}>{url || 'Loading…'}</code>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="add-subtask" onClick={copy} disabled={!url}>Copy URL</button>
            <button className="add-subtask" onClick={rotate} disabled={busy || !url}>{busy ? 'Rotating…' : 'Rotate token'}</button>
          </div>
          <p style={{ color: 'var(--ink-3)', fontSize: 11, marginTop: 12, fontFamily: 'IBM Plex Mono, monospace' }}>
            The token IS the auth — anyone with the URL can read your task list. Rotate if it leaks.
          </p>
        </div>
      </div>
    </div>
  );
}

function BackupsModal({ onClose, onRestore }) {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const toast = (m) => { try { window.__taskboardToast?.(m); } catch (e) {} };

  const refresh = async () => {
    setLoading(true);
    try {
      const r = await fetch('/api/backups', { cache: 'no-store' });
      if (r.ok) setList(await r.json());
    } catch (e) {}
    setLoading(false);
  };
  useEffect(() => { refresh(); }, []);

  const restore = async (id) => {
    if (!confirm('Replace current state with this snapshot? Local changes will be overwritten.')) return;
    try {
      const r = await fetch(`/api/backups/${id}`);
      if (!r.ok) { toast('Restore failed'); return; }
      const j = await r.json();
      if (j && j.data && Array.isArray(j.data.projects)) {
        onRestore(j.data);
        toast(`Restored snapshot #${id}`);
        onClose();
      }
    } catch (e) { toast('Restore failed'); }
  };

  const remove = async (id) => {
    if (!confirm('Delete this snapshot?')) return;
    try {
      const r = await fetch(`/api/backups/${id}`, { method: 'DELETE' });
      if (r.ok) { toast('Snapshot deleted'); refresh(); }
    } catch (e) {}
  };

  const fmtSize = (n) => n < 1024 ? `${n} B` : n < 1024*1024 ? `${(n/1024).toFixed(1)} KB` : `${(n/1024/1024).toFixed(1)} MB`;

  return (
    <div className="palette-overlay" onClick={onClose}>
      <div className="palette" style={{ width: 640 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={{ fontWeight: 600, color: 'var(--ink)' }}>Server snapshots</div>
          <button className="icon-btn" onClick={onClose}><Icon.X size={14}/></button>
        </div>
        <div style={{ maxHeight: '60vh', overflowY: 'auto', padding: 6 }}>
          {loading && <div style={{ padding: 16, color: 'var(--ink-3)' }}>Loading…</div>}
          {!loading && list.length === 0 && <div style={{ padding: 16, color: 'var(--ink-3)' }}>No snapshots yet. Use the command palette: "Save snapshot to server".</div>}
          {list.map(b => (
            <div key={b.id} style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '10px 14px', borderRadius: 8,
            }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ color: 'var(--ink)', fontSize: 13.5 }}>
                  #{b.id} · {new Date(b.created_at).toLocaleString()}
                </div>
                <div style={{ color: 'var(--ink-3)', fontSize: 11, fontFamily: 'IBM Plex Mono, monospace' }}>
                  {b.source} · {fmtSize(b.size)}{b.note ? ` · ${b.note}` : ''}
                </div>
              </div>
              <button className="add-subtask" onClick={() => restore(b.id)}>Restore</button>
              <button className="icon-btn" onClick={() => remove(b.id)}><Icon.Trash size={13}/></button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function TaskRow({ task, project, expanded, onToggleExpand, onUpdate, onDelete, dragHandlers, dropClass }) {
  const due = formatDueDate(task.dueDate);
  const subProgress = task.subtasks.length > 0
    ? task.subtasks.filter(s => s.done).length / task.subtasks.length
    : 0;
  const subDoneCount = task.subtasks.filter(s => s.done).length;
  const newSubRef = useRef(null);

  const toggleComplete = (e) => {
    e.stopPropagation();
    onUpdate({ ...task, completed: !task.completed });
  };

  const updateField = (k, v) => onUpdate({ ...task, [k]: v });

  const addSubtask = () => {
    const newSt = { id: uid(), title: '', done: false };
    onUpdate({ ...task, subtasks: [...task.subtasks, newSt] });
    setTimeout(() => {
      const inputs = document.querySelectorAll(`[data-task-id="${task.id}"] .subtask-input`);
      const last = inputs[inputs.length - 1];
      if (last) last.focus();
    }, 50);
  };

  const updateSubtask = (sid, patch) => {
    onUpdate({
      ...task,
      subtasks: task.subtasks.map(s => s.id === sid ? { ...s, ...patch } : s),
    });
  };
  const deleteSubtask = (sid) => {
    onUpdate({ ...task, subtasks: task.subtasks.filter(s => s.id !== sid) });
  };

  return (
    <div
      className={`task ${task.completed ? 'completed' : ''} ${expanded ? 'expanded' : ''} ${dropClass || ''}`}
      data-task-id={task.id}
      draggable={dragHandlers ? true : undefined}
      onDragStart={dragHandlers?.onDragStart}
      onDragOver={dragHandlers?.onDragOver}
      onDragLeave={dragHandlers?.onDragLeave}
      onDrop={dragHandlers?.onDrop}
      onDragEnd={dragHandlers?.onDragEnd}
    >
      <div className="task-row" onClick={onToggleExpand}>
        <button className={`task-checkbox ${task.completed ? 'checked' : ''}`} onClick={toggleComplete}>
          <Icon.Check size={12}/>
        </button>
        <div className="task-main">
          {expanded ? (
            <input
              className="task-title-input"
              value={task.title}
              onChange={(e) => updateField('title', e.target.value)}
              onClick={(e) => e.stopPropagation()}
              placeholder="Task title"
            />
          ) : (
            <div className="task-title">{task.title || <span style={{ color: 'var(--ink-4)' }}>Untitled task</span>}</div>
          )}
          <div className="task-meta">
            {project && (
              <span className="task-meta-item">
                <span className="priority-dot" style={{ background: project.color }}/>
                {project.name}
              </span>
            )}
            {task.priority && task.priority !== 'none' && (
              <span className="task-meta-item">
                <span className={`priority-dot priority-${task.priority}`}/>
                {task.priority === 'high' ? 'High' : task.priority === 'med' ? 'Medium' : 'Low'}
              </span>
            )}
            {due && (
              <span className={`task-meta-item ${task.completed ? 'completed-meta' : due.state}`}>
                <Icon.Calendar/> {due.label}
              </span>
            )}
            {task.subtasks.length > 0 && (
              <span className="task-meta-item">
                <Icon.Branch/> {subDoneCount}/{task.subtasks.length}
              </span>
            )}
            {task.recur && task.recur !== 'none' && (
              <span className="task-meta-item recur-badge">
                <Icon.Repeat/> {recurLabel(task.recur)}
              </span>
            )}
          </div>
        </div>
        <div className="task-actions" onClick={(e) => e.stopPropagation()}>
          <button className="icon-btn" title="Delete task" onClick={onDelete}><Icon.Trash size={13}/></button>
        </div>
        <span className="expand-chevron"><Icon.Chevron/></span>
      </div>

      {expanded && (
        <div className="task-body">
          <div className="body-section">
            <div className="meta-row">
              <label className="field">
                <span className="field-icon"><Icon.Calendar/></span>
                <input
                  type="date"
                  value={task.dueDate || ''}
                  onChange={(e) => updateField('dueDate', e.target.value)}
                />
                {task.dueDate && (
                  <button className="icon-btn" style={{ width: 16, height: 16 }} onClick={() => updateField('dueDate', '')} title="Clear date"><Icon.X size={10}/></button>
                )}
              </label>
              <label className="field">
                <span className="field-icon"><Icon.Flag/></span>
                <select
                  className="field-select"
                  value={task.priority || 'none'}
                  onChange={(e) => updateField('priority', e.target.value)}
                >
                  <option value="none">No priority</option>
                  <option value="low">Low</option>
                  <option value="med">Medium</option>
                  <option value="high">High</option>
                </select>
              </label>
              <label className="field">
                <span className="field-icon"><Icon.Repeat/></span>
                <select
                  className="field-select"
                  value={task.recur || 'none'}
                  onChange={(e) => updateField('recur', e.target.value)}
                  title="Recurrence"
                >
                  {RECUR_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </label>
            </div>
          </div>

          <div className="body-section">
            <div className="body-label">Notes</div>
            <textarea
              className="description-textarea"
              value={task.description || ''}
              onChange={(e) => updateField('description', e.target.value)}
              placeholder="Add notes, links, context…"
            />
          </div>

          <div className="body-section">
            <div className="body-label">Subtasks {task.subtasks.length > 0 && `· ${subDoneCount}/${task.subtasks.length}`}</div>
            {task.subtasks.length > 0 && (
              <div className="subtask-progress">
                <div className="progress-bar"><div className="progress-fill" style={{ width: `${subProgress * 100}%` }}/></div>
                <span className="progress-text">{Math.round(subProgress * 100)}%</span>
              </div>
            )}
            <div className="subtask-list">
              {task.subtasks.map(st => (
                <SubtaskItem
                  key={st.id}
                  st={st}
                  onToggle={() => updateSubtask(st.id, { done: !st.done })}
                  onChange={(v) => updateSubtask(st.id, { title: v })}
                  onDelete={() => deleteSubtask(st.id)}
                  onEnter={addSubtask}
                />
              ))}
            </div>
            <button className="add-subtask" onClick={addSubtask}>
              <Icon.Plus size={11}/> Add subtask
            </button>
          </div>

          <Attachments taskId={task.id}/>
        </div>
      )}
    </div>
  );
}

function MainView({ data, setData, newTaskTrigger, focusSearchTrigger }) {
  const [filter, setFilter] = useState('all'); // all | open | done
  const [search, setSearch] = useState('');
  const [expandedId, setExpandedId] = useState(null);
  const [newTaskTitle, setNewTaskTitle] = useState('');
  const titleInputRef = useRef(null);
  const searchInputRef = useRef(null);
  const [editingProjectName, setEditingProjectName] = useState(false);
  const [draggedTaskId, setDraggedTaskId] = useState(null);
  const [dropTarget, setDropTarget] = useState(null); // { id, where }

  // External triggers (keyboard shortcuts)
  useEffect(() => {
    if (newTaskTrigger > 0) {
      titleInputRef.current?.focus();
    }
  }, [newTaskTrigger]);
  useEffect(() => {
    if (focusSearchTrigger > 0) {
      searchInputRef.current?.focus();
      searchInputRef.current?.select();
    }
  }, [focusSearchTrigger]);
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape' && expandedId && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
        setExpandedId(null);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [expandedId]);

  const activeProject = useMemo(
    () => data.projects.find(p => p.id === data.activeProjectId),
    [data.projects, data.activeProjectId]
  );

  // Compute the list of tasks shown based on view
  const { displayTasks, viewTitle, viewSubtitle, viewProject } = useMemo(() => {
    if (data.activeView === 'today') {
      const today = todayStr();
      const tasks = [];
      data.projects.forEach(p => {
        p.tasks.forEach(t => {
          if (!t.completed && t.dueDate && t.dueDate <= today) {
            tasks.push({ ...t, _projectId: p.id });
          }
        });
      });
      return { displayTasks: tasks, viewTitle: 'Today', viewSubtitle: 'Due today and overdue', viewProject: null };
    }
    if (data.activeView === 'all') {
      const tasks = [];
      data.projects.forEach(p => p.tasks.forEach(t => tasks.push({ ...t, _projectId: p.id })));
      return { displayTasks: tasks, viewTitle: 'All Tasks', viewSubtitle: 'Across every project', viewProject: null };
    }
    if (!activeProject) {
      return { displayTasks: [], viewTitle: 'No project', viewSubtitle: 'Create one in the sidebar', viewProject: null };
    }
    return {
      displayTasks: activeProject.tasks.map(t => ({ ...t, _projectId: activeProject.id })),
      viewTitle: activeProject.name,
      viewSubtitle: 'Project',
      viewProject: activeProject,
    };
  }, [data, activeProject]);

  // Apply filter + search
  const filteredTasks = useMemo(() => {
    return displayTasks.filter(t => {
      if (filter === 'open' && t.completed) return false;
      if (filter === 'done' && !t.completed) return false;
      if (search) {
        const q = search.toLowerCase();
        const inTitle = (t.title || '').toLowerCase().includes(q);
        const inDesc = (t.description || '').toLowerCase().includes(q);
        const inSub = t.subtasks.some(s => (s.title || '').toLowerCase().includes(q));
        if (!inTitle && !inDesc && !inSub) return false;
      }
      return true;
    });
  }, [displayTasks, filter, search]);

  // Group tasks by deadline urgency for richer presentation
  const groupedTasks = useMemo(() => {
    const today = todayStr();
    const groups = {
      overdue: [], today: [], thisWeek: [], later: [], noDate: [], completed: []
    };
    filteredTasks.forEach(t => {
      if (t.completed) { groups.completed.push(t); return; }
      if (!t.dueDate) { groups.noDate.push(t); return; }
      if (t.dueDate < today) { groups.overdue.push(t); return; }
      if (t.dueDate === today) { groups.today.push(t); return; }
      const d = new Date(t.dueDate + 'T00:00:00');
      const diff = (d - new Date(today + 'T00:00:00')) / 86400000;
      if (diff <= 7) groups.thisWeek.push(t);
      else groups.later.push(t);
    });
    Object.keys(groups).forEach(k => {
      groups[k].sort((a, b) => {
        if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate) return -1; if (b.dueDate) return 1;
        return 0;
      });
    });
    return groups;
  }, [filteredTasks]);

  const counts = useMemo(() => {
    return {
      all: displayTasks.length,
      open: displayTasks.filter(t => !t.completed).length,
      done: displayTasks.filter(t => t.completed).length,
    };
  }, [displayTasks]);

  // Update task within data
  const updateTask = useCallback((updated) => {
    const projectId = updated._projectId;
    setData(d => ({
      ...d,
      projects: d.projects.map(p => {
        if (p.id !== projectId) return p;
        return {
          ...p,
          tasks: p.tasks.map(t => {
            if (t.id !== updated.id) return t;
            // Recurring: when marking complete, spawn next instance
            const cleaned = { ...updated, _projectId: undefined };
            const wasComplete = t.completed;
            if (!wasComplete && cleaned.completed && cleaned.recur && cleaned.recur !== 'none') {
              const nextDue = nextRecurrence(cleaned.dueDate || todayStr(), cleaned.recur);
              const reset = {
                ...cleaned,
                id: uid(),
                completed: false,
                dueDate: nextDue,
                subtasks: cleaned.subtasks.map(s => ({ ...s, id: uid(), done: false })),
              };
              return [cleaned, reset];
            }
            return cleaned;
          }).flat(),
        };
      }),
    }));
  }, [setData]);

  const deleteTask = useCallback((task) => {
    if (!confirm('Delete this task?')) return;
    setData(d => ({
      ...d,
      projects: d.projects.map(p => {
        if (p.id !== task._projectId) return p;
        return { ...p, tasks: p.tasks.filter(t => t.id !== task.id) };
      }),
    }));
  }, [setData]);

  const addTask = useCallback(() => {
    const title = newTaskTitle.trim();
    if (!title) return;
    if (!activeProject) return;
    const newT = {
      id: uid(), title, completed: false, priority: 'none',
      dueDate: '', description: '', subtasks: [], recur: 'none',
    };
    setData(d => ({
      ...d,
      projects: d.projects.map(p =>
        p.id === activeProject.id ? { ...p, tasks: [newT, ...p.tasks] } : p
      ),
    }));
    setNewTaskTitle('');
    setExpandedId(newT.id);
  }, [newTaskTitle, activeProject, setData]);

  const renameProject = (newName) => {
    if (!activeProject) return;
    setData(d => ({
      ...d,
      projects: d.projects.map(p => p.id === activeProject.id ? { ...p, name: newName.trim() || 'Untitled' } : p),
    }));
  };

  // Drag handlers for tasks within the active project (project view only)
  const makeDragHandlers = (task) => {
    if (!isProjectView) return null;
    return {
      onDragStart: (e) => {
        setDraggedTaskId(task.id);
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', task.id); } catch (err) {}
      },
      onDragOver: (e) => {
        if (!draggedTaskId || draggedTaskId === task.id) return;
        e.preventDefault();
        const rect = e.currentTarget.getBoundingClientRect();
        const where = (e.clientY - rect.top) < rect.height / 2 ? 'above' : 'below';
        setDropTarget({ id: task.id, where });
      },
      onDragLeave: () => {
        setDropTarget(prev => prev && prev.id === task.id ? null : prev);
      },
      onDrop: (e) => {
        e.preventDefault();
        if (!draggedTaskId || draggedTaskId === task.id) { setDropTarget(null); return; }
        const target = task.id;
        const where = dropTarget?.where || 'above';
        setData(d => ({
          ...d,
          projects: d.projects.map(p => {
            if (p.id !== activeProject.id) return p;
            const list = [...p.tasks];
            const fromIdx = list.findIndex(t => t.id === draggedTaskId);
            if (fromIdx === -1) return p;
            const [moved] = list.splice(fromIdx, 1);
            let toIdx = list.findIndex(t => t.id === target);
            if (toIdx === -1) toIdx = list.length;
            if (where === 'below') toIdx += 1;
            list.splice(toIdx, 0, moved);
            return { ...p, tasks: list };
          }),
        }));
        setDraggedTaskId(null);
        setDropTarget(null);
      },
      onDragEnd: () => { setDraggedTaskId(null); setDropTarget(null); },
    };
  };

  const renderGroup = (key, label, tasks, urgent = false) => {
    if (tasks.length === 0) return null;
    return (
      <div key={key}>
        <div className={`task-group-header ${urgent ? 'urgent' : ''}`}>
          <span>{label}</span>
          <span>{tasks.length}</span>
        </div>
        {tasks.map(t => {
          const proj = data.projects.find(p => p.id === t._projectId);
          const dropClass = dropTarget?.id === t.id ? `drop-${dropTarget.where} dragging-target` : (draggedTaskId === t.id ? 'dragging' : '');
          return (
            <TaskRow
              key={t.id}
              task={t}
              project={data.activeView !== 'project' ? proj : null}
              expanded={expandedId === t.id}
              onToggleExpand={() => setExpandedId(expandedId === t.id ? null : t.id)}
              onUpdate={updateTask}
              onDelete={() => deleteTask(t)}
              dragHandlers={makeDragHandlers(t)}
              dropClass={dropClass}
            />
          );
        })}
      </div>
    );
  };

  const isProjectView = data.activeView === 'project' && activeProject;

  return (
    <main className="main">
      <header className="main-header">
        <div className="header-left">
          <div className="breadcrumb">
            {data.activeView === 'project' && activeProject
              ? <><Icon.Folder/> Project</>
              : data.activeView === 'today' ? <><Icon.Today/> View</>
              : <><Icon.Inbox/> View</>
            }
          </div>
          {isProjectView ? (
            editingProjectName ? (
              <input
                autoFocus
                className="project-title-input"
                defaultValue={activeProject.name}
                onBlur={(e) => { renameProject(e.target.value); setEditingProjectName(false); }}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') { renameProject(e.target.value); setEditingProjectName(false); }
                  if (e.key === 'Escape') setEditingProjectName(false);
                }}
              />
            ) : (
              <div className="project-title-input" style={{ cursor: 'text' }} onClick={() => setEditingProjectName(true)}>
                {activeProject.name}
              </div>
            )
          ) : (
            <div className="project-title-input" style={{ pointerEvents: 'none' }}>{viewTitle}</div>
          )}
          <div className="project-meta">
            {isProjectView ? (
              <>
                <span className="meta-pill"><span className="priority-dot" style={{ background: activeProject.color }}/> Color</span>
                <span className="meta-pill"><strong>{counts.open}</strong> open</span>
                <span className="meta-pill"><strong>{counts.done}</strong> done</span>
                <span className="meta-pill">{viewSubtitle}</span>
              </>
            ) : (
              <>
                <span className="meta-pill"><strong>{counts.open}</strong> open</span>
                <span className="meta-pill"><strong>{counts.done}</strong> done</span>
                <span className="meta-pill">{viewSubtitle}</span>
              </>
            )}
          </div>
        </div>
        <div className="header-right">
          {isProjectView && (
            <button className="btn btn-primary" onClick={() => titleInputRef.current?.focus()}>
              <Icon.Plus size={13}/> New task
            </button>
          )}
        </div>
      </header>

      <div className="toolbar">
        <button className={`filter-tab ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>
          All <span className="num">{counts.all}</span>
        </button>
        <button className={`filter-tab ${filter === 'open' ? 'active' : ''}`} onClick={() => setFilter('open')}>
          Open <span className="num">{counts.open}</span>
        </button>
        <button className={`filter-tab ${filter === 'done' ? 'active' : ''}`} onClick={() => setFilter('done')}>
          Done <span className="num">{counts.done}</span>
        </button>
        <div className="toolbar-spacer"/>
        <input
          ref={searchInputRef}
          className="search-input"
          placeholder="Search tasks…  (press / )"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      <div className="task-canvas">
        {isProjectView && (
          <div className="add-task-row" onClick={() => titleInputRef.current?.focus()}>
            <span className="placeholder-circle"/>
            <input
              ref={titleInputRef}
              className="add-task-input"
              placeholder="Add a task and press Enter…"
              value={newTaskTitle}
              onChange={(e) => setNewTaskTitle(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') addTask(); }}
            />
          </div>
        )}

        {filteredTasks.length === 0 ? (
          <div className="empty-state">
            <h3>Nothing here yet</h3>
            <p>{isProjectView ? 'Add your first task above to get started.' : 'No tasks match this view.'}</p>
          </div>
        ) : (
          <>
            {renderGroup('overdue', 'Overdue', groupedTasks.overdue, true)}
            {renderGroup('today', 'Today', groupedTasks.today)}
            {renderGroup('thisWeek', 'This Week', groupedTasks.thisWeek)}
            {renderGroup('later', 'Later', groupedTasks.later)}
            {renderGroup('noDate', 'No Deadline', groupedTasks.noDate)}
            {renderGroup('completed', 'Completed', groupedTasks.completed)}
          </>
        )}
      </div>
    </main>
  );
}

function App() {
  const [data, setData] = useState(loadData);
  const [theme, setTheme] = useState(loadTheme);
  const [toast, setToast] = useState('');
  const [user, setUser] = useState(null);
  const importInputRef = useRef(null);

  const handleLogout = async () => {
    try { await fetch('/api/session', { method: 'DELETE' }); } catch (e) {}
    location.replace('/login.html');
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2400);
  };

  const exportJSON = () => {
    const payload = {
      _format: 'task-board',
      _version: 1,
      exportedAt: new Date().toISOString(),
      data,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0,10);
    a.download = `task-board-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Exported backup file');
  };

  const importJSON = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        const payload = parsed && parsed.data ? parsed.data : parsed;
        if (!payload || !Array.isArray(payload.projects)) {
          showToast('Import failed: invalid file');
          return;
        }
        if (!confirm('Replace current tasks with this backup? This cannot be undone.')) return;
        const cleanProjects = payload.projects.map(p => ({
          id: p.id || uid(),
          name: p.name || 'Untitled',
          color: p.color || '#c1542a',
          createdAt: p.createdAt || Date.now(),
          tasks: (p.tasks || []).map(t => ({
            id: t.id || uid(),
            title: t.title || '',
            completed: !!t.completed,
            priority: t.priority || 'none',
            dueDate: t.dueDate || '',
            description: t.description || '',
            subtasks: (t.subtasks || []).map(s => ({
              id: s.id || uid(),
              title: s.title || '',
              done: !!s.done,
            })),
          })),
        }));
        setData({
          projects: cleanProjects,
          activeProjectId: payload.activeProjectId || cleanProjects[0]?.id || null,
          activeView: payload.activeView || 'project',
        });
        showToast(`Imported ${cleanProjects.length} project${cleanProjects.length === 1 ? '' : 's'}`);
      } catch (err) {
        showToast('Import failed: bad JSON');
      }
    };
    reader.readAsText(file);
  };

  useEffect(() => { saveData(data); }, [data]);
  useEffect(() => {
    (async () => {
      const u = await fetchSession();
      if (!u) { location.replace('/login.html'); return; }
      setUser(u);
      const srv = await fetchServerData();
      if (srv) setData(srv);
    })();
  }, []);
  useEffect(() => { window.__taskboardToast = showToast; }, [showToast]);
  useEffect(() => {
    saveTheme(theme);
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  const [paletteOpen, setPaletteOpen] = useState(false);
  const [backupsOpen, setBackupsOpen] = useState(false);
  const [feedOpen, setFeedOpen] = useState(false);
  const [notesInitialDate, setNotesInitialDate] = useState(null);
  const newTaskRequestRef = useRef(0);
  const focusSearchRef = useRef(0);
  const [, forceTick] = useState(0);

  const requestNewTask = () => { newTaskRequestRef.current += 1; forceTick(t => t + 1); };
  const requestFocusSearch = () => { focusSearchRef.current += 1; forceTick(t => t + 1); };

  const addProjectFromApp = () => {
    const colors = ['#c1542a', '#5c7a3a', '#b88820', '#6b5b8a', '#3a6e7a', '#a04060'];
    const newP = { id: uid(), name: 'New Project', color: colors[Math.floor(Math.random()*colors.length)], createdAt: Date.now(), tasks: [] };
    setData(d => ({ ...d, projects: [...d.projects, newP], activeProjectId: newP.id, activeView: 'project' }));
  };

  const handlePaletteAction = (action) => {
    setPaletteOpen(false);
    if (action.type === 'view') setData(d => ({ ...d, activeView: action.view }));
    else if (action.type === 'project') setData(d => ({ ...d, activeProjectId: action.id, activeView: 'project' }));
    else if (action.type === 'task') setData(d => ({ ...d, activeProjectId: action.projectId, activeView: 'project' }));
    else if (action.type === 'note') { setNotesInitialDate(action.date); setData(d => ({ ...d, activeView: 'notes' })); }
    else if (action.type === 'newtask') { setData(d => ({ ...d, activeView: 'project' })); setTimeout(requestNewTask, 50); }
    else if (action.type === 'newproject') addProjectFromApp();
    else if (action.type === 'export') exportJSON();
    else if (action.type === 'snapshot') saveSnapshot();
    else if (action.type === 'restore') setBackupsOpen(true);
    else if (action.type === 'feed') setFeedOpen(true);
    else if (action.type === 'theme') setTheme(t => t === 'light' ? 'dark' : 'light');
  };

  const saveSnapshot = async () => {
    try {
      const r = await fetch('/api/backups', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data, source: 'manual' }),
      });
      if (r.ok) {
        const j = await r.json();
        showToast(`Saved snapshot #${j.id}`);
      } else {
        showToast('Snapshot failed');
      }
    } catch (e) {
      showToast('Snapshot failed: network error');
    }
  };

  // Global shortcuts
  useEffect(() => {
    const onKey = (e) => {
      const tgt = e.target;
      const isTyping = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.isContentEditable);
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setPaletteOpen(true);
        return;
      }
      if (e.key === 'Escape' && paletteOpen) { setPaletteOpen(false); return; }
      if (isTyping) return;
      if (e.key === '/') { e.preventDefault(); requestFocusSearch(); }
      else if (e.key.toLowerCase() === 'n') { e.preventDefault(); requestNewTask(); }
      else if (e.key.toLowerCase() === 't') { e.preventDefault(); setData(d => ({ ...d, activeView: 'today' })); }
      else if (e.key.toLowerCase() === 'a') { e.preventDefault(); setData(d => ({ ...d, activeView: 'all' })); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [paletteOpen]);

  const totals = useMemo(() => {
    const today = todayStr();
    let all = 0, todayCount = 0;
    data.projects.forEach(p => p.tasks.forEach(t => {
      if (!t.completed) all += 1;
      if (!t.completed && t.dueDate && t.dueDate <= today) todayCount += 1;
    }));
    return { all, today: todayCount };
  }, [data]);

  return (
    <>
      <Sidebar
        data={data}
        setData={setData}
        theme={theme}
        setTheme={setTheme}
        totals={totals}
        onExport={exportJSON}
        onImportClick={() => importInputRef.current?.click()}
        user={user}
        onLogout={handleLogout}
      />
      {data.activeView === 'notes'
        ? <NotesView initialDate={notesInitialDate}/>
        : <MainView
            data={data}
            setData={setData}
            newTaskTrigger={newTaskRequestRef.current}
            focusSearchTrigger={focusSearchRef.current}
          />
      }
      <input
        ref={importInputRef}
        type="file"
        accept="application/json,.json"
        style={{ display: 'none' }}
        onChange={(e) => {
          const f = e.target.files?.[0];
          importJSON(f);
          e.target.value = '';
        }}
      />
      <div className={`toast ${toast ? 'show' : ''}`}>{toast}</div>
      {paletteOpen && <CommandPalette data={data} onClose={() => setPaletteOpen(false)} onAction={handlePaletteAction}/>}
      {backupsOpen && <BackupsModal onClose={() => setBackupsOpen(false)} onRestore={(d) => setData(d)}/>}
      {feedOpen && <CalendarFeedModal onClose={() => setFeedOpen(false)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);

</script>
</body>
</html>
