// ---------- Notes rail (scope + list of notes) ----------

function NotesRail({
  scope, setScope, notebooks, tags, recentDates,
  notes, activeNoteId, onSelectNote, search, setSearch,
  onCreateNotebook, onRenameNotebook, onDeleteNotebook,
  onReorderNotes, onCreateNote, sortMode, setSortMode,
}) {
  const [editingNb, setEditingNb] = useState(null);
  const [creatingNb, setCreatingNb] = useState(false);
  const [dragId, setDragId] = useState(null);
  const [dropTarget, setDropTarget] = useState(null);

  const isActive = (s) => scope.kind === s.kind && scope.id === s.id && scope.value === s.value;

  const onDragStart = (e, id) => { setDragId(id); e.dataTransfer.effectAllowed = 'move'; };
  const onDragOver = (e, id) => {
    if (!dragId || dragId === id) return;
    e.preventDefault();
    const r = e.currentTarget.getBoundingClientRect();
    const above = (e.clientY - r.top) < r.height / 2;
    setDropTarget({ id, above });
  };
  const onDrop = (e, id) => {
    e.preventDefault();
    if (!dragId || dragId === id || !dropTarget) return;
    const ids = notes.map(n => n.id);
    const fromIdx = ids.indexOf(dragId);
    const toIdx = ids.indexOf(id) + (dropTarget.above ? 0 : 1);
    if (fromIdx < 0 || toIdx < 0) return;
    const arr = [...ids];
    arr.splice(fromIdx, 1);
    arr.splice(toIdx > fromIdx ? toIdx - 1 : toIdx, 0, dragId);
    onReorderNotes(arr);
    setDragId(null); setDropTarget(null);
  };

  return (
    <aside className="notes-rail">
      <div className="rail-scope">
        <div className="rail-section">
          <div className="section-label"><span>Quick</span></div>
          <div className={`rail-item ${isActive({ kind: 'today' }) ? 'active' : ''}`}
               onClick={() => setScope({ kind: 'today', value: todayStr() })}>
            <span className="ri-icon"><Icon.Today/></span>
            <span className="ri-label">Today</span>
          </div>
          <div className={`rail-item ${scope.kind === 'all' ? 'active' : ''}`}
               onClick={() => setScope({ kind: 'all' })}>
            <span className="ri-icon"><Icon.Inbox/></span>
            <span className="ri-label">All notes</span>
          </div>
          <div className={`rail-item ${scope.kind === 'pinned' ? 'active' : ''}`}
               onClick={() => setScope({ kind: 'pinned' })}>
            <span className="ri-icon" style={{ color: 'var(--warning)' }}><Icon.Star/></span>
            <span className="ri-label">Pinned</span>
          </div>
        </div>

        <div className="rail-section">
          <div className="section-label">
            <span>Notebooks</span>
            <button className="add-mini" title="New notebook" onClick={() => setCreatingNb(true)}>+</button>
          </div>
          {notebooks.length === 0 && (
            <div style={{ color: 'var(--ink-4)', fontSize: 11, padding: '4px 10px' }}>No notebooks yet</div>
          )}
          {notebooks.map(nb => (
            <div key={nb.id}
                 className={`rail-item ${scope.kind === 'notebook' && scope.id === nb.id ? 'active' : ''}`}
                 onClick={() => setScope({ kind: 'notebook', id: nb.id, name: nb.name })}>
              <span className="ri-color" style={{ background: nb.color }}/>
              <span className="ri-label">{nb.name}</span>
              <span className="ri-count">{nb.count ?? 0}</span>
              <span className="ri-actions">
                <button className="icon-btn" title="Rename"
                        onClick={(e) => { e.stopPropagation(); setEditingNb(nb); }}>
                  <Icon.Edit size={11}/>
                </button>
                <button className="icon-btn" title="Delete"
                        onClick={(e) => { e.stopPropagation();
                          if (confirm(`Delete "${nb.name}"? Notes will be moved out of the notebook (not deleted).`)) onDeleteNotebook(nb.id);
                        }}>
                  <Icon.Trash size={11}/>
                </button>
              </span>
            </div>
          ))}
        </div>

        {tags.length > 0 && (
          <div className="rail-section">
            <div className="section-label"><span>Tags</span></div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, padding: '0 8px 6px' }}>
              {tags.slice(0, 24).map(t => (
                <span key={t.tag}
                      className={`tag-chip ${scope.kind === 'tag' && scope.value === t.tag ? 'active' : ''}`}
                      onClick={() => setScope({ kind: 'tag', value: t.tag })}>
                  #{t.tag} <span style={{ opacity: 0.6 }}>{t.count}</span>
                </span>
              ))}
            </div>
          </div>
        )}

        {recentDates.length > 0 && (
          <div className="rail-section">
            <div className="section-label"><span>Recent days</span></div>
            {recentDates.slice(0, 12).map(d => (
              <div key={d.date}
                   className={`rail-item ${scope.kind === 'date' && scope.value === d.date ? 'active' : ''}`}
                   onClick={() => setScope({ kind: 'date', value: d.date })}>
                <span className="ri-icon"><Icon.Calendar/></span>
                <span className="ri-label" style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 11.5 }}>
                  {d.date}
                </span>
                <span className="ri-count">{d.count}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="rail-list-header">
        <input
          className="rail-search"
          placeholder="Search this scope…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
        <button className="icon-btn" title="New note in this scope" onClick={onCreateNote}>
          <Icon.Plus size={13}/>
        </button>
      </div>

      <div className="rail-list">
        {notes.length === 0 ? (
          <div style={{ padding: 14, color: 'var(--ink-4)', fontSize: 12, textAlign: 'center' }}>
            No notes here yet.
          </div>
        ) : notes.map(n => {
          const dropClass = dropTarget?.id === n.id
            ? (dropTarget.above ? 'drop-above' : 'drop-below') : '';
          const dragClass = dragId === n.id ? 'dragging' : '';
          const untitled = !n.title;
          return (
            <div
              key={n.id}
              className={`note-row ${activeNoteId === n.id ? 'active' : ''} ${untitled ? 'untitled' : ''} ${dropClass} ${dragClass}`}
              draggable={sortMode === 'manual'}
              onDragStart={(e) => onDragStart(e, n.id)}
              onDragOver={(e) => onDragOver(e, n.id)}
              onDrop={(e) => onDrop(e, n.id)}
              onDragEnd={() => { setDragId(null); setDropTarget(null); }}
              onClick={() => onSelectNote(n.id)}
            >
              <div className="nr-top">
                {n.pinned && <span className="nr-pin"><Icon.Star/></span>}
                <span className="nr-title">{n.title || 'Untitled'}</span>
              </div>
              <div className="nr-meta">
                <span>{n.date}</span>
                {n.notebook_id && <span>· in nb</span>}
                <span style={{ marginLeft: 'auto' }}>{countWords(n.body)}w</span>
              </div>
              {n.body && (
                <div className="nr-snippet">{n.body.replace(/[\n\r]+/g, ' ').slice(0, 80)}</div>
              )}
            </div>
          );
        })}
      </div>

      {creatingNb && (
        <NotebookEditModal
          onClose={() => setCreatingNb(false)}
          onSave={async (vals) => { await onCreateNotebook(vals); }}
        />
      )}
      {editingNb && (
        <NotebookEditModal
          initial={editingNb}
          onClose={() => setEditingNb(null)}
          onSave={async (vals) => { await onRenameNotebook(editingNb.id, vals); }}
        />
      )}
    </aside>
  );
}

// ---------- Editor ----------

function NoteEditor({
  note, allTitles, prefs, setPrefs,
  onChange, onDelete, onTogglePin, onMoveToNotebook, notebooks,
  onOpenWikiLink, onJumpToTag, onDuplicate,
  twoUp, onToggleTwoUp,
}) {
  const [title, setTitle] = useState(note.title);
  const [body, setBody] = useState(note.body);
  const [savedState, setSavedState] = useState('saved'); // 'saved' | 'saving' | 'error'
  const [popover, setPopover] = useState(null); // { kind: 'slash' | 'wiki', items, selected, anchor, replaceFrom, replaceTo }
  const [backlinks, setBacklinks] = useState([]);
  const [showBacklinks, setShowBacklinks] = useState(true);
  const [dropZone, setDropZone] = useState(false);
  const textareaRef = useRef(null);
  const previewRef = useRef(null);
  const saveTimer = useRef(null);
  const lastSaved = useRef({ title: note.title, body: note.body });

  // Sync incoming note changes (e.g., from BroadcastChannel)
  useEffect(() => {
    setTitle(note.title);
    setBody(note.body);
    lastSaved.current = { title: note.title, body: note.body };
  }, [note.id]);

  // Debounced save
  useEffect(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    if (title === lastSaved.current.title && body === lastSaved.current.body) return;
    setSavedState('saving');
    saveTimer.current = setTimeout(async () => {
      const patch = {};
      if (title !== lastSaved.current.title) patch.title = title;
      if (body !== lastSaved.current.body) patch.body = body;
      try {
        const r = await fetch(`/api/notes/${note.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
        if (r.ok) {
          lastSaved.current = { title, body };
          setSavedState('saved');
          const updated = await r.json();
          onChange?.(updated);
          broadcastNotes({ type: 'note-changed', id: note.id });
        } else {
          setSavedState('error');
        }
      } catch (e) { setSavedState('error'); }
    }, 350);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [title, body, note.id]);

  // Backlinks
  useEffect(() => {
    if (!note.id || !note.title) { setBacklinks([]); return; }
    const t = setTimeout(async () => {
      try {
        const r = await fetch(`/api/notes/${note.id}/backlinks`, { cache: 'no-store' });
        if (r.ok) setBacklinks(await r.json());
      } catch (e) {}
    }, 250);
    return () => clearTimeout(t);
  }, [note.id, note.title, lastSaved.current.body]);

  const rendered = useMemo(() => {
    const html = renderMarkdown(body || '_(empty)_');
    return html;
  }, [body]);

  // Mark broken wikilinks (those without a target). allTitles is lowered.
  const renderedHtml = useMemo(() => {
    const titleSet = new Set(allTitles.map(t => t.title.toLowerCase()));
    return rendered.replace(/<a href="#" class="wikilink" data-wikilink="([^"]+)">([^<]+)<\/a>/g,
      (m, target, text) => {
        const exists = titleSet.has(target.toLowerCase());
        const cls = exists ? 'wikilink' : 'wikilink broken';
        return `<a href="#" class="${cls}" data-wikilink="${target}">${text}</a>`;
      });
  }, [rendered, allTitles]);

  // Handle clicks in the preview pane (wikilinks, hashtags, checkboxes)
  useEffect(() => {
    const el = previewRef.current;
    if (!el) return;
    const onClick = (e) => {
      const wiki = e.target.closest?.('a.wikilink');
      if (wiki) { e.preventDefault(); onOpenWikiLink?.(wiki.dataset.wikilink); return; }
      const tag = e.target.closest?.('a.tag-link');
      if (tag) { e.preventDefault(); onJumpToTag?.(tag.dataset.tag); return; }
      if (e.target.matches?.('input[type="checkbox"]')) {
        e.preventDefault();
        // Toggle Nth checkbox in source
        const inputs = Array.from(el.querySelectorAll('input[type="checkbox"]'));
        const idx = inputs.indexOf(e.target);
        if (idx < 0) return;
        let count = 0;
        const next = body.replace(/^([ \t]*[-*+] \[)([ xX])(\])/gm, (_, pre, mark, post) => {
          if (count++ !== idx) return _;
          const newMark = (mark.toLowerCase() === 'x') ? ' ' : 'x';
          return `${pre}${newMark}${post}`;
        });
        if (next !== body) setBody(next);
      }
    };
    el.addEventListener('click', onClick);
    return () => el.removeEventListener('click', onClick);
  }, [body, onOpenWikiLink, onJumpToTag]);

  // Re-highlight code on render
  useEffect(() => {
    if (typeof hljs === 'undefined') return;
    previewRef.current?.querySelectorAll('pre code:not(.hljs-done)').forEach(el => {
      try { hljs.highlightElement(el); el.classList.add('hljs-done'); } catch (e) {}
    });
  }, [renderedHtml]);

  // Slash menu / wiki autocomplete trigger
  const triggerPopover = (kind, replaceFrom, replaceTo, query = '') => {
    const ta = textareaRef.current;
    if (!ta) return;
    const rect = ta.getBoundingClientRect();
    // Approximate caret position via a hidden mirror div
    const caretXY = getCaretCoordinates(ta, ta.selectionStart);
    // popover is position: fixed — use viewport-relative coords (no scroll offsets)
    const top = rect.top + caretXY.top - ta.scrollTop + 22;
    const left = rect.left + caretXY.left - ta.scrollLeft;
    let items = [];
    if (kind === 'slash') {
      const ql = query.toLowerCase();
      items = SLASH_ITEMS
        .filter(it => !ql || it.label.toLowerCase().includes(ql))
        .map((it, i) => ({ ...it, idx: i }));
    } else if (kind === 'wiki') {
      const ql = query.toLowerCase();
      items = allTitles
        .filter(t => !ql || t.title.toLowerCase().includes(ql))
        .slice(0, 12)
        .map(t => ({ key: 'w-' + t.id, label: t.title, meta: t.date, target: t.title, icon: '[[' }));
      if (query && !items.some(it => it.target.toLowerCase() === query.toLowerCase())) {
        items.push({ key: 'new', label: `Create "${query}"`, meta: 'new note', target: query, icon: '+', isNew: true });
      }
    }
    setPopover({ kind, items, selected: 0, anchor: { top, left }, replaceFrom, replaceTo, query });
  };

  // Detect typing of '/' at line start, '[[ … ]]' opening
  const onKeyUp = (e) => {
    if (e.key === 'Escape') { setPopover(null); return; }
    const ta = textareaRef.current;
    if (!ta) return;
    const pos = ta.selectionStart;
    const v = ta.value;
    // Wiki: detect [[ before caret without closing ]]
    const wikiMatch = /\[\[([^\[\]\n]{0,80})$/.exec(v.slice(0, pos));
    if (wikiMatch && !v.slice(0, pos).endsWith(']]')) {
      triggerPopover('wiki', pos - wikiMatch[0].length, pos, wikiMatch[1]);
      return;
    }
    // Slash: detect '/' at start of line
    const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
    const lineSoFar = v.slice(lineStart, pos);
    const slashMatch = /^\/(\w*)$/.exec(lineSoFar);
    if (slashMatch) {
      triggerPopover('slash', lineStart, pos, slashMatch[1]);
      return;
    }
    setPopover(null);
  };

  const onKeyDown = (e) => {
    if (popover) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        setPopover(p => p ? { ...p, selected: Math.min(p.items.length - 1, p.selected + 1) } : p);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setPopover(p => p ? { ...p, selected: Math.max(0, p.selected - 1) } : p);
      } else if (e.key === 'Enter' || e.key === 'Tab') {
        if (popover.items.length > 0) {
          e.preventDefault();
          pickPopoverItem(popover.selected);
        }
      } else if (e.key === 'Escape') {
        e.preventDefault(); setPopover(null);
      }
      return;
    }
    // Common shortcuts inside textarea
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey) {
      const k = e.key.toLowerCase();
      if (k === 'b') { e.preventDefault(); applyTextareaChange(setBody, textareaRef, '**', '**', 'bold'); }
      else if (k === 'i') { e.preventDefault(); applyTextareaChange(setBody, textareaRef, '*', '*', 'italic'); }
      else if (k === 'k') { e.preventDefault(); applyTextareaChange(setBody, textareaRef, '[', '](https://)', 'text'); }
      else if (k === '`' || k === 'e') { e.preventDefault(); applyTextareaChange(setBody, textareaRef, '`', '`', 'code'); }
    }
  };

  const pickPopoverItem = (idx) => {
    if (!popover) return;
    const item = popover.items[idx];
    if (!item) return;
    if (popover.kind === 'slash') {
      // Replace "/query" with markdown via apply()
      replaceRangeInTextarea(setBody, textareaRef, popover.replaceFrom, popover.replaceTo, '');
      setTimeout(() => {
        item.apply((before, after, placeholder) =>
          applyTextareaChange(setBody, textareaRef, before, after, placeholder));
      }, 5);
    } else if (popover.kind === 'wiki') {
      const replacement = `[[${item.target}]]`;
      // Replace from the start of [[ to current pos, keep caret after ]]
      const ta = textareaRef.current;
      const before = ta.value.slice(0, popover.replaceFrom);
      const after = ta.value.slice(popover.replaceTo);
      // Strip any trailing ']]' user already typed
      const cleanedAfter = after.startsWith(']]') ? after.slice(2) : after;
      const next = before + replacement + cleanedAfter;
      const caret = before.length + replacement.length;
      setBody(next);
      setTimeout(() => { ta.focus(); ta.setSelectionRange(caret, caret); }, 0);
    }
    setPopover(null);
  };

  // Image upload (paste / drop)
  const uploadImage = async (file) => {
    if (!file || !file.type.startsWith('image/')) return null;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const r = await fetch(`/api/notes/${note.id}/images`, { method: 'POST', body: fd });
      const j = await r.json();
      if (r.ok) return j;
    } catch (e) {}
    return null;
  };

  const onPaste = async (e) => {
    const items = e.clipboardData?.items || [];
    for (const it of items) {
      if (it.kind === 'file' && it.type.startsWith('image/')) {
        e.preventDefault();
        const file = it.getAsFile();
        const r = await uploadImage(file);
        if (r) {
          applyTextareaChange(setBody, textareaRef,
            `![${file.name || 'image'}](${r.url})`, '', '');
        }
        return;
      }
    }
  };

  const onDrop = async (e) => {
    e.preventDefault(); setDropZone(false);
    const file = e.dataTransfer?.files?.[0];
    if (!file) return;
    const r = await uploadImage(file);
    if (r) {
      applyTextareaChange(setBody, textareaRef,
        `![${file.name || 'image'}](${r.url})`, '', '');
    }
  };

  const fontClass = prefs.font === 'sans' ? 'font-sans' : prefs.font === 'serif' ? 'font-serif' : '';

  const wc = countWords(body);
  const cc = (body || '').length;

  const paneClass = twoUp ? 'split-2up' :
                    prefs.layout === 'edit' ? 'split-edit' :
                    prefs.layout === 'preview' ? 'split-preview' : 'split-both';

  return (
    <div className="editor-shell">
      {/* toolbar */}
      <div className="editor-toolbar">
        <input
          className="title-input"
          value={title}
          onChange={(e) => setTitle(e.target.value)}
          placeholder="Untitled note"
        />
        <button title="Pin / unpin" className={note.pinned ? 'active' : ''} onClick={onTogglePin}>
          <Icon.Star/>
        </button>
        <span className="sep"/>
        <button title="Edit only" className={prefs.layout === 'edit' && !twoUp ? 'active' : ''}
                onClick={() => setPrefs(p => ({ ...p, layout: 'edit' }))}>Edit</button>
        <button title="Split" className={prefs.layout === 'split' && !twoUp ? 'active' : ''}
                onClick={() => setPrefs(p => ({ ...p, layout: 'split' }))}>Split</button>
        <button title="Preview only" className={prefs.layout === 'preview' && !twoUp ? 'active' : ''}
                onClick={() => setPrefs(p => ({ ...p, layout: 'preview' }))}>Preview</button>
        <button title="Open a second note side by side" className={twoUp ? 'active' : ''}
                onClick={onToggleTwoUp}>2-up</button>
        <span className="sep"/>
        <button title="Bold (⌘B)" onClick={() => applyTextareaChange(setBody, textareaRef, '**', '**', 'bold')}><b>B</b></button>
        <button title="Italic (⌘I)" onClick={() => applyTextareaChange(setBody, textareaRef, '*', '*', 'italic')}><i>I</i></button>
        <button title="Inline code" onClick={() => applyTextareaChange(setBody, textareaRef, '`', '`', 'code')}>{'<>'}</button>
        <button title="Bulleted list" onClick={() => applyTextareaChange(setBody, textareaRef, '- ', '', 'item')}>•</button>
        <button title="Checklist item" onClick={() => applyTextareaChange(setBody, textareaRef, '- [ ] ', '', 'task')}>☐</button>
        <button title="Heading" onClick={() => applyTextareaChange(setBody, textareaRef, '## ', '', 'Heading')}>H</button>
        <button title="Insert table" onClick={() => applyTextareaChange(setBody, textareaRef,
          '\n| Col A | Col B | Col C |\n| --- | --- | --- |\n| ', ' |  |  |\n', 'cell')}>⊞</button>
        <span className="sep"/>
        <select
          title="Font" value={prefs.font}
          onChange={(e) => setPrefs(p => ({ ...p, font: e.target.value }))}
          className="field-select"
          style={{ background: 'transparent', border: '1px solid transparent', borderRadius: 5,
                   padding: '4px 16px 4px 8px', color: 'var(--ink-3)', fontSize: 11.5, cursor: 'pointer' }}
        >
          <option value="mono">Mono</option>
          <option value="sans">Sans</option>
          <option value="serif">Serif</option>
        </select>
        {notebooks.length > 0 && (
          <select
            title="Move to notebook"
            value={note.notebook_id || ''}
            onChange={(e) => onMoveToNotebook(e.target.value || null)}
            className="field-select"
            style={{ background: 'transparent', border: '1px solid transparent', borderRadius: 5,
                     padding: '4px 16px 4px 8px', color: 'var(--ink-3)', fontSize: 11.5, cursor: 'pointer' }}
          >
            <option value="">— Daily / no notebook —</option>
            {notebooks.map(nb => <option key={nb.id} value={nb.id}>{nb.name}</option>)}
          </select>
        )}
        <span className="toolbar-spacer"/>
        <button title="Duplicate note" onClick={onDuplicate}>Duplicate</button>
        <button title="Print / Save as PDF" onClick={() => window.print()}>PDF</button>
        <button title="Delete note" onClick={onDelete}><Icon.Trash size={12}/></button>
      </div>

      {/* edit + preview */}
      <div className={`editor-pane ${paneClass}`}>
        <div
          className={`editor-textarea-wrap ${dropZone ? 'dropzone-active' : ''}`}
          onDragOver={(e) => { e.preventDefault(); setDropZone(true); }}
          onDragLeave={() => setDropZone(false)}
          onDrop={onDrop}
        >
          <textarea
            ref={textareaRef}
            className={`editor-textarea ${fontClass}`}
            spellCheck={false}
            value={body}
            onChange={(e) => setBody(e.target.value)}
            onKeyDown={onKeyDown}
            onKeyUp={onKeyUp}
            onPaste={onPaste}
            placeholder={"Type away. '/' for slash menu, '[[' for wiki-links, '#tag' to tag, drop or paste images directly…"}
            style={{ fontSize: prefs.fontSize || 13 }}
          />
        </div>
        <div className="editor-preview-wrap">
          <div
            ref={previewRef}
            className="markdown-body editor-preview"
            dangerouslySetInnerHTML={{ __html: renderedHtml }}
          />
        </div>
      </div>

      {/* status bar */}
      <div className="note-statusbar">
        <span className={savedState}>
          {savedState === 'saved' && '● saved'}
          {savedState === 'saving' && '● saving…'}
          {savedState === 'error' && '● save failed (retrying)'}
        </span>
        <span>{wc} words · {cc} chars</span>
        <span>{note.date}</span>
        <span className="status-spacer"/>
        <span>id: {note.id.slice(0, 6)}</span>
      </div>

      {/* backlinks */}
      {showBacklinks && (
        <div className="backlinks-panel">
          <div className="bp-title">
            <span>Backlinks ({backlinks.length})</span>
            <button className="icon-btn" style={{ marginLeft: 'auto' }} title="Hide"
                    onClick={() => setShowBacklinks(false)}><Icon.X size={11}/></button>
          </div>
          {backlinks.length === 0 ? (
            <div className="bp-empty">No notes link to <strong>{note.title || '(untitled)'}</strong> yet. Reference it as <code>[[{note.title || 'Title'}]]</code> from another note.</div>
          ) : backlinks.map(b => (
            <div key={b.id} className="bp-row" onClick={() => onOpenWikiLink?.(b.title)}>
              <span>{b.title || '(untitled)'}</span>
              <span className="bp-meta">{b.date}</span>
            </div>
          ))}
        </div>
      )}

      {popover && <PopoverMenu
        items={popover.items}
        selected={popover.selected}
        anchor={popover.anchor}
        onHover={(i) => setPopover(p => p ? { ...p, selected: i } : p)}
        onPick={pickPopoverItem}
        onClose={() => setPopover(null)}
      />}
    </div>
  );
}

// Caret positioning helper for popover anchoring
function getCaretCoordinates(textarea, position) {
  // Lightweight mirror-div approach
  const div = document.createElement('div');
  const style = window.getComputedStyle(textarea);
  for (const prop of [
    'boxSizing','width','height','overflowX','overflowY','borderTopWidth','borderRightWidth',
    'borderBottomWidth','borderLeftWidth','paddingTop','paddingRight','paddingBottom','paddingLeft',
    'fontStyle','fontVariant','fontWeight','fontStretch','fontSize','lineHeight','fontFamily',
    'textAlign','textTransform','textIndent','letterSpacing','wordSpacing','tabSize',
  ]) { div.style[prop] = style[prop]; }
  div.style.whiteSpace = 'pre-wrap';
  div.style.wordWrap = 'break-word';
  div.style.position = 'absolute';
  div.style.visibility = 'hidden';
  div.style.top = '0';
  div.style.left = '0';
  document.body.appendChild(div);
  div.textContent = textarea.value.substring(0, position);
  const span = document.createElement('span');
  span.textContent = textarea.value.substring(position) || '.';
  div.appendChild(span);
  const rect = { top: span.offsetTop - textarea.scrollTop, left: span.offsetLeft - textarea.scrollLeft };
  document.body.removeChild(div);
  return rect;
}

// ---------- Notes view (top-level) ----------

function NotesView({ initialDate }) {
  const [scope, setScope] = useState(
    initialDate ? { kind: 'date', value: initialDate } : { kind: 'today', value: todayStr() }
  );
  const [search, setSearch] = useState('');
  const [notes, setNotes] = useState([]);
  const [allTitles, setAllTitles] = useState([]);
  const [notebooks, setNotebooks] = useState([]);
  const [tags, setTags] = useState([]);
  const [recentDates, setRecentDates] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [activeId2, setActiveId2] = useState(null);
  const [twoUp, setTwoUp] = useState(false);
  const [openTabs, setOpenTabs] = useState([]); // [{id, title}]
  const [prefs, _setPrefs] = useState(loadNotesPrefs);
  const setPrefs = useCallback((updater) => {
    _setPrefs(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveNotesPrefs(next); return next;
    });
  }, []);

  useEffect(() => {
    if (initialDate) setScope({ kind: 'date', value: initialDate });
  }, [initialDate]);

  // ---- loaders ----
  const buildScopeQuery = useCallback((s) => {
    const params = new URLSearchParams();
    if (s.kind === 'today') { params.set('date', todayStr()); }
    else if (s.kind === 'date') { params.set('date', s.value); }
    else if (s.kind === 'all') { params.set('all', '1'); }
    else if (s.kind === 'pinned') { params.set('pinned', '1'); }
    else if (s.kind === 'notebook') { params.set('notebook_id', s.id); }
    else if (s.kind === 'tag') { params.set('tag', s.value); }
    return params.toString();
  }, []);

  const loadNotes = useCallback(async () => {
    const q = buildScopeQuery(scope);
    try {
      const r = await fetch(`/api/notes?${q}`, { cache: 'no-store' });
      if (r.status === 401) { location.replace('/login.html'); return; }
      if (r.ok) setNotes(await r.json());
    } catch (e) {}
  }, [scope, buildScopeQuery]);

  const loadNotebooks = useCallback(async () => {
    try { const r = await fetch('/api/notebooks', { cache: 'no-store' }); if (r.ok) setNotebooks(await r.json()); } catch (e) {}
  }, []);
  const loadTags = useCallback(async () => {
    try { const r = await fetch('/api/notes/tags', { cache: 'no-store' }); if (r.ok) setTags(await r.json()); } catch (e) {}
  }, []);
  const loadDates = useCallback(async () => {
    try { const r = await fetch('/api/notes/dates', { cache: 'no-store' }); if (r.ok) setRecentDates(await r.json()); } catch (e) {}
  }, []);
  const loadTitles = useCallback(async () => {
    try { const r = await fetch('/api/notes/titles', { cache: 'no-store' }); if (r.ok) setAllTitles(await r.json()); } catch (e) {}
  }, []);

  useEffect(() => { loadNotes(); }, [loadNotes]);
  useEffect(() => { loadNotebooks(); loadTags(); loadDates(); loadTitles(); }, [loadNotebooks, loadTags, loadDates, loadTitles]);

  // BroadcastChannel: refresh on changes from other tabs
  useEffect(() => {
    if (!NOTES_CHANNEL) return;
    const onMsg = (e) => {
      const msg = e.data || {};
      if (msg.type === 'note-changed' || msg.type === 'list-changed') {
        loadNotes(); loadTitles(); loadTags(); loadDates();
      }
      if (msg.type === 'notebooks-changed') loadNotebooks();
    };
    NOTES_CHANNEL.addEventListener('message', onMsg);
    return () => NOTES_CHANNEL.removeEventListener('message', onMsg);
  }, [loadNotes, loadTitles, loadTags, loadDates, loadNotebooks]);

  // Active note auto-pick
  useEffect(() => {
    if (!notes.length) { setActiveId(null); return; }
    if (!notes.find(n => n.id === activeId)) setActiveId(notes[0].id);
  }, [notes, activeId]);

  // Apply local search
  const filteredNotes = useMemo(() => {
    if (!search.trim()) return notes;
    const q = search.toLowerCase();
    return notes.filter(n =>
      (n.title || '').toLowerCase().includes(q) ||
      (n.body || '').toLowerCase().includes(q));
  }, [notes, search]);

  const activeNote = useMemo(() => notes.find(n => n.id === activeId) || null, [notes, activeId]);
  const activeNote2 = useMemo(() => notes.find(n => n.id === activeId2) || null, [notes, activeId2]);

  // Update local note state after edits (without full reload)
  const applyNoteUpdate = (updated) => {
    setNotes(prev => prev.map(n => n.id === updated.id ? { ...n, ...updated } : n));
  };

  // ---- actions ----
  const createNote = async () => {
    const body = {};
    if (scope.kind === 'notebook') body.notebook_id = scope.id;
    else if (scope.kind === 'date') body.date = scope.value;
    else if (scope.kind === 'today') body.date = todayStr();
    else if (scope.kind === 'pinned') { body.pinned = true; body.date = todayStr(); }
    // 'all' / 'tag' default to today, no notebook
    try {
      const r = await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (r.ok) {
        const created = await r.json();
        await loadNotes(); await loadTitles(); await loadDates();
        setActiveId(created.id);
        broadcastNotes({ type: 'list-changed' });
      }
    } catch (e) {}
  };

  const removeNote = async (id) => {
    if (!confirm('Delete this note?')) return;
    try {
      const r = await fetch(`/api/notes/${id}`, { method: 'DELETE' });
      if (r.ok) {
        await loadNotes(); await loadTitles(); await loadTags(); await loadDates();
        setOpenTabs(t => t.filter(x => x.id !== id));
        if (activeId === id) setActiveId(null);
        if (activeId2 === id) setActiveId2(null);
        broadcastNotes({ type: 'list-changed' });
      }
    } catch (e) {}
  };

  const togglePin = async (n) => {
    try {
      const r = await fetch(`/api/notes/${n.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pinned: !n.pinned }),
      });
      if (r.ok) { applyNoteUpdate(await r.json()); broadcastNotes({ type: 'note-changed', id: n.id }); }
    } catch (e) {}
  };

  const moveNoteToNotebook = async (id, notebookId) => {
    try {
      const r = await fetch(`/api/notes/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notebook_id: notebookId || '' }),
      });
      if (r.ok) {
        applyNoteUpdate(await r.json());
        await loadNotebooks();
        broadcastNotes({ type: 'note-changed', id });
      }
    } catch (e) {}
  };

  const duplicateNote = async (id) => {
    try {
      const r = await fetch(`/api/notes/${id}/duplicate`, { method: 'POST' });
      if (r.ok) {
        const dup = await r.json();
        await loadNotes(); await loadTitles();
        setActiveId(dup.id);
        broadcastNotes({ type: 'list-changed' });
      }
    } catch (e) {}
  };

  const reorderNotes = async (ids) => {
    // Optimistic
    setNotes(prev => {
      const map = new Map(prev.map(n => [n.id, n]));
      return ids.map(id => map.get(id)).filter(Boolean);
    });
    try {
      await fetch('/api/notes/reorder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids }),
      });
      broadcastNotes({ type: 'list-changed' });
    } catch (e) {}
  };

  const createNotebook = async (vals) => {
    try {
      const r = await fetch('/api/notebooks', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(vals),
      });
      if (r.ok) {
        const nb = await r.json();
        await loadNotebooks();
        setScope({ kind: 'notebook', id: nb.id, name: nb.name });
        broadcastNotes({ type: 'notebooks-changed' });
      }
    } catch (e) {}
  };
  const renameNotebook = async (id, vals) => {
    try {
      const r = await fetch(`/api/notebooks/${id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(vals),
      });
      if (r.ok) { await loadNotebooks(); broadcastNotes({ type: 'notebooks-changed' }); }
    } catch (e) {}
  };
  const deleteNotebook = async (id) => {
    try {
      const r = await fetch(`/api/notebooks/${id}`, { method: 'DELETE' });
      if (r.ok) {
        await loadNotebooks(); await loadNotes();
        if (scope.kind === 'notebook' && scope.id === id) setScope({ kind: 'all' });
        broadcastNotes({ type: 'notebooks-changed' });
      }
    } catch (e) {}
  };

  // Wiki link click: go to that note (open or create)
  const openWikiLink = async (target) => {
    try {
      const r = await fetch(`/api/notes/by-title?title=${encodeURIComponent(target)}`);
      if (r.ok) {
        const note = await r.json();
        // Make sure note is in current scope; if not, switch
        if (!notes.find(n => n.id === note.id)) setScope({ kind: 'all' });
        addTab(note);
        setActiveId(note.id);
      } else if (r.status === 404) {
        // Create on the fly
        const cr = await fetch('/api/notes', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: target, body: '' }),
        });
        if (cr.ok) {
          const note = await cr.json();
          await loadNotes(); await loadTitles();
          setScope({ kind: 'all' });
          addTab(note);
          setActiveId(note.id);
        }
      }
    } catch (e) {}
  };

  const jumpToTag = (tag) => setScope({ kind: 'tag', value: tag });

  // Tabs management
  const addTab = (n) => setOpenTabs(prev => prev.find(x => x.id === n.id) ? prev : [...prev, { id: n.id, title: n.title || 'Untitled' }]);
  const closeTab = (id) => {
    setOpenTabs(prev => prev.filter(x => x.id !== id));
    if (activeId === id) setActiveId(null);
    if (activeId2 === id) setActiveId2(null);
  };

  // When a note becomes active via row click, ensure it's a tab
  useEffect(() => {
    if (activeNote) addTab(activeNote);
  }, [activeNote?.id]); // eslint-disable-line

  // Update tab title when active note title changes
  useEffect(() => {
    if (!activeNote) return;
    setOpenTabs(prev => prev.map(t => t.id === activeNote.id ? { ...t, title: activeNote.title || 'Untitled' } : t));
  }, [activeNote?.title]); // eslint-disable-line

  const scopeLabel = useMemo(() => {
    if (scope.kind === 'today') return 'Today';
    if (scope.kind === 'date') return scope.value;
    if (scope.kind === 'all') return 'All notes';
    if (scope.kind === 'pinned') return 'Pinned';
    if (scope.kind === 'tag') return `#${scope.value}`;
    if (scope.kind === 'notebook') {
      const nb = notebooks.find(x => x.id === scope.id);
      return nb ? nb.name : 'Notebook';
    }
    return 'Notes';
  }, [scope, notebooks]);

  // 2-up secondary picker: when toggling on, choose any other note
  useEffect(() => {
    if (twoUp && !activeId2) {
      const other = notes.find(n => n.id !== activeId);
      if (other) setActiveId2(other.id);
    }
    if (!twoUp) setActiveId2(null);
  }, [twoUp]); // eslint-disable-line

  return (
    <main className="main">
      <header className="main-header">
        <div className="header-left">
          <div className="breadcrumb"><Icon.Edit size={11}/> Notes · {scopeLabel}</div>
          <div className="project-title-input" style={{ pointerEvents: 'none' }}>
            {scopeLabel}
            {scope.kind === 'date' && (
              <span style={{ color: 'var(--ink-3)', fontWeight: 400, fontSize: 14 }}> · {(() => {
                const t = todayStr();
                if (scope.value === t) return 'today';
                const y = new Date(t + 'T00:00:00'); y.setDate(y.getDate() - 1);
                if (scope.value === y.toISOString().slice(0, 10)) return 'yesterday';
                return new Date(scope.value + 'T00:00:00').toLocaleDateString(undefined,
                  { weekday: 'short', month: 'short', day: 'numeric' });
              })()}</span>
            )}
          </div>
          <div className="project-meta">
            <span className="meta-pill">{notes.length} note{notes.length === 1 ? '' : 's'}</span>
            {scope.kind === 'date' && (
              <>
                <span style={{ color: 'var(--ink-4)' }}>·</span>
                <a className="meta-pill" href={`/api/notes/export?date=${scope.value}`} style={{ color: 'var(--accent)' }}>
                  <Icon.Download size={11}/> .md
                </a>
              </>
            )}
            <span style={{ color: 'var(--ink-4)' }}>·</span>
            <a className="meta-pill" href="/api/notes/export.zip" style={{ color: 'var(--accent)' }}>
              <Icon.Download size={11}/> .zip all
            </a>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          {scope.kind === 'date' && (
            <>
              <button className="add-subtask" onClick={() => {
                const d = new Date(scope.value + 'T00:00:00'); d.setDate(d.getDate() - 1);
                setScope({ kind: 'date', value: d.toISOString().slice(0, 10) });
              }}>← Prev</button>
              <button className="add-subtask" onClick={() => setScope({ kind: 'today', value: todayStr() })}>Today</button>
              <button className="add-subtask" onClick={() => {
                const d = new Date(scope.value + 'T00:00:00'); d.setDate(d.getDate() + 1);
                setScope({ kind: 'date', value: d.toISOString().slice(0, 10) });
              }}>Next →</button>
              <input
                type="date" value={scope.value}
                onChange={(e) => e.target.value && setScope({ kind: 'date', value: e.target.value })}
                style={{ padding: '5px 8px', background: 'var(--surface-2)',
                         border: '1px solid var(--border)', borderRadius: 6,
                         color: 'var(--ink)', font: 'inherit', fontSize: 12 }}
              />
            </>
          )}
        </div>
      </header>

      <div className="notes-shell">
        <NotesRail
          scope={scope}
          setScope={setScope}
          notebooks={notebooks}
          tags={tags}
          recentDates={recentDates}
          notes={filteredNotes}
          activeNoteId={activeId}
          onSelectNote={(id) => setActiveId(id)}
          search={search}
          setSearch={setSearch}
          onCreateNotebook={createNotebook}
          onRenameNotebook={renameNotebook}
          onDeleteNotebook={deleteNotebook}
          onReorderNotes={reorderNotes}
          onCreateNote={createNote}
          sortMode={prefs.sortMode}
          setSortMode={(m) => setPrefs(p => ({ ...p, sortMode: m }))}
        />

        <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0, minHeight: 0, flex: 1 }}>
          {/* Tabs */}
          {openTabs.length > 0 && (
            <div className="note-tabs">
              {openTabs.map(t => (
                <div
                  key={t.id}
                  className={`note-tab ${activeId === t.id ? 'active' : ''}`}
                  onClick={() => setActiveId(t.id)}
                >
                  <span className="nt-title">{t.title || 'Untitled'}</span>
                  <button className="nt-close" onClick={(e) => { e.stopPropagation(); closeTab(t.id); }}>×</button>
                </div>
              ))}
            </div>
          )}

          {/* Active note(s) */}
          {!activeNote ? (
            <div style={{ flex: 1, display: 'grid', placeItems: 'center', color: 'var(--ink-3)', padding: 40 }}>
              <div style={{ textAlign: 'center', maxWidth: 380 }}>
                <h3 style={{ fontFamily: 'Fraunces, serif', fontWeight: 400, fontSize: 22, color: 'var(--ink-2)', marginBottom: 8 }}>
                  No note selected
                </h3>
                <p style={{ fontSize: 13, marginBottom: 14 }}>
                  Pick one from the rail, or create a new one.
                </p>
                <button className="btn btn-primary" onClick={createNote}>
                  <Icon.Plus size={12}/> New note in {scopeLabel}
                </button>
              </div>
            </div>
          ) : twoUp && activeNote2 ? (
            <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 1fr', minHeight: 0 }}>
              <NoteEditor
                note={activeNote}
                allTitles={allTitles}
                prefs={prefs} setPrefs={setPrefs}
                onChange={applyNoteUpdate}
                onDelete={() => removeNote(activeNote.id)}
                onTogglePin={() => togglePin(activeNote)}
                onMoveToNotebook={(id) => moveNoteToNotebook(activeNote.id, id)}
                onDuplicate={() => duplicateNote(activeNote.id)}
                onOpenWikiLink={openWikiLink}
                onJumpToTag={jumpToTag}
                notebooks={notebooks}
                twoUp={twoUp}
                onToggleTwoUp={() => setTwoUp(false)}
              />
              <div style={{ borderLeft: '1px solid var(--border)', display: 'flex', flexDirection: 'column', minWidth: 0 }}>
                <div style={{ padding: '6px 12px', borderBottom: '1px solid var(--border)',
                              fontSize: 11, color: 'var(--ink-3)', display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span>Right pane:</span>
                  <select value={activeId2 || ''} onChange={(e) => setActiveId2(e.target.value)}
                          className="field-select"
                          style={{ background: 'transparent', border: '1px solid var(--border)', borderRadius: 5,
                                   padding: '3px 16px 3px 8px', color: 'var(--ink-2)', fontSize: 11, cursor: 'pointer' }}>
                    {notes.filter(n => n.id !== activeId).map(n => (
                      <option key={n.id} value={n.id}>{n.title || 'Untitled'} · {n.date}</option>
                    ))}
                  </select>
                </div>
                <NoteEditor
                  note={activeNote2}
                  allTitles={allTitles}
                  prefs={prefs} setPrefs={setPrefs}
                  onChange={applyNoteUpdate}
                  onDelete={() => removeNote(activeNote2.id)}
                  onTogglePin={() => togglePin(activeNote2)}
                  onMoveToNotebook={(id) => moveNoteToNotebook(activeNote2.id, id)}
                  onDuplicate={() => duplicateNote(activeNote2.id)}
                  onOpenWikiLink={openWikiLink}
                  onJumpToTag={jumpToTag}
                  notebooks={notebooks}
                  twoUp={false}
                  onToggleTwoUp={() => setTwoUp(true)}
                />
              </div>
            </div>
          ) : (
            <NoteEditor
              key={activeNote.id}
              note={activeNote}
              allTitles={allTitles}
              prefs={prefs} setPrefs={setPrefs}
              onChange={applyNoteUpdate}
              onDelete={() => removeNote(activeNote.id)}
              onTogglePin={() => togglePin(activeNote)}
              onMoveToNotebook={(id) => moveNoteToNotebook(activeNote.id, id)}
              onDuplicate={() => duplicateNote(activeNote.id)}
              onOpenWikiLink={openWikiLink}
              onJumpToTag={jumpToTag}
              notebooks={notebooks}
              twoUp={twoUp}
              onToggleTwoUp={() => setTwoUp(t => !t)}
            />
          )}
        </div>
      </div>
    </main>
  );
}

function Attachments({ taskId }) {
  const [list, setList] = useState([]);
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);
  const toast = (m) => { try { window.__taskboardToast?.(m); } catch (e) {} };

  const refresh = useCallback(async () => {
    try {
      const r = await fetch(`/api/attachments?task_id=${encodeURIComponent(taskId)}`, { cache: 'no-store' });
      if (r.ok) setList(await r.json());
    } catch (e) {}
  }, [taskId]);

  useEffect(() => { refresh(); }, [refresh]);

  const upload = async (file) => {
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) { toast('File too large (max 25 MB)'); return; }
    setUploading(true);
    const fd = new FormData();
    fd.append('file', file);
    try {
      const r = await fetch(`/api/attachments?task_id=${encodeURIComponent(taskId)}`, { method: 'POST', body: fd });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        toast(`Upload failed: ${j.error || r.status}`);
      } else {
        toast('Attached');
        refresh();
      }
    } catch (e) {
      toast('Upload failed: network error');
    } finally {
      setUploading(false);
    }
  };

  const remove = async (id) => {
    if (!confirm('Delete this attachment?')) return;
    try {
      const r = await fetch(`/api/attachments/${id}`, { method: 'DELETE' });
      if (r.ok) { toast('Removed'); refresh(); }
    } catch (e) {}
  };

  const fmtSize = (n) => {
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    return `${(n / 1024 / 1024).toFixed(1)} MB`;
  };

  return (
    <div className="body-section">
      <div className="body-label">Attachments {list.length > 0 && `· ${list.length}`}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 6 }}>
        {list.map(a => (
          <div key={a.id} style={{
            display: 'flex', alignItems: 'center', gap: 8,
            padding: '6px 10px', background: 'var(--surface-2)',
            border: '1px solid var(--border)', borderRadius: 6, fontSize: 13,
          }}>
            <a href={`/api/attachments/${a.id}`} target="_blank" rel="noreferrer"
               style={{ color: 'var(--ink)', textDecoration: 'none', flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {a.filename}
            </a>
            <span style={{ color: 'var(--ink-3)', fontSize: 11, fontFamily: 'IBM Plex Mono, monospace' }}>{fmtSize(a.size)}</span>
            <button className="icon-btn" title="Delete" onClick={() => remove(a.id)}><Icon.Trash size={12}/></button>
          </div>
        ))}
      </div>
      <input
        ref={fileInputRef}
        type="file"
        style={{ display: 'none' }}
        onChange={(e) => { const f = e.target.files?.[0]; upload(f); e.target.value = ''; }}
      />
      <button className="add-subtask" disabled={uploading} onClick={() => fileInputRef.current?.click()}>
        <Icon.Plus size={11}/> {uploading ? 'Uploading…' : 'Attach file'}
      </button>
    </div>
  );
}

function ShortcutsModal({ onClose }) {
  const isMac = typeof navigator !== 'undefined' && /Mac|iPod|iPhone|iPad/.test(navigator.platform);
  const meta = isMac ? '⌘' : 'Ctrl';
  const sections = [
    {
      title: 'Global',
      rows: [
        [`${meta} K`, 'Open command palette (search, jump, actions)'],
        ['/', 'Focus the in-page search box'],
        ['N', 'New task in current project'],
        ['T', 'Go to Today view'],
        ['A', 'Go to All Tasks view'],
        ['Esc', 'Close palette / collapse expanded task'],
        ['?', 'Show this help'],
      ],
    },
    {
      title: 'In a note',
      rows: [
        [`${meta} B`, 'Bold the selection'],
        [`${meta} I`, 'Italicize the selection'],
        [`${meta} K`, 'Wrap selection in a link'],
        [`${meta} \``, 'Wrap selection in inline code'],
        ['/', 'Open slash menu (heading, list, code, table, …)'],
        ['[[', 'Open wiki-link autocomplete; pick or create a note'],

function TwoFactorModal({ onClose }) {
  const [enabled, setEnabled] = useState(null);     // null = loading
  const [setup, setSetup] = useState(null);          // { secret, uri } during enrollment
  const [code, setCode] = useState('');
  const [busy, setBusy] = useState(false);
  const toast = (m) => { try { window.__taskboardToast?.(m); } catch (e) {} };

  const refresh = async () => {
    try {
      const r = await fetch('/api/2fa/status', { cache: 'no-store' });
      if (r.ok) setEnabled((await r.json()).enabled);
    } catch (e) {}
  };
  useEffect(() => { refresh(); }, []);

  const qrSvg = useMemo(() => {
    if (!setup?.uri || typeof qrcode === 'undefined') return '';
    try {
      const q = qrcode(0, 'M');
      q.addData(setup.uri);
      q.make();
      return q.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
    } catch (e) { return ''; }
  }, [setup]);

  const startSetup = async () => {
    setBusy(true);
    try {
      const r = await fetch('/api/2fa/setup', { method: 'POST' });
      const j = await r.json();
      if (r.ok) setSetup(j); else toast(j.error || 'Setup failed');
    } catch (e) { toast('Network error'); }
    setBusy(false);
  };

  const enable = async () => {
    setBusy(true);
    try {
      const r = await fetch('/api/2fa/enable', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code.trim() }),
      });
      const j = await r.json();
      if (r.ok) { toast('2FA enabled'); setSetup(null); setCode(''); refresh(); }
      else toast(j.error || 'Invalid code');
    } catch (e) { toast('Network error'); }
    setBusy(false);
  };

  const disable = async () => {
    if (!confirm('Disable 2FA? You will only need your password to sign in.')) return;
    setBusy(true);
    try {
      const r = await fetch('/api/2fa/disable', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code.trim() }),
      });
      const j = await r.json();
      if (r.ok) { toast('2FA disabled'); setCode(''); refresh(); }
      else toast(j.error || 'Invalid code');
    } catch (e) { toast('Network error'); }
    setBusy(false);
  };

  return (
    <div className="palette-overlay" onClick={onClose}>
      <div className="palette" style={{ width: 520 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={{ fontWeight: 600, color: 'var(--ink)' }}>Two-factor authentication</div>
          <button className="icon-btn" onClick={onClose}><Icon.X size={14}/></button>
        </div>
        <div style={{ padding: '18px' }}>
          {enabled === null && <div style={{ color: 'var(--ink-3)' }}>Loading…</div>}

          {enabled === false && !setup && (
            <>
              <p style={{ color: 'var(--ink-2)', fontSize: 13, marginBottom: 14 }}>
                2FA adds a 6-digit code requirement at sign-in. Use any TOTP app
                (Authy, 1Password, Google Authenticator, Bitwarden).
              </p>
              <button className="add-subtask" onClick={startSetup} disabled={busy}>Begin setup</button>
            </>
          )}

          {enabled === false && setup && (
            <>
              <p style={{ color: 'var(--ink-2)', fontSize: 13, marginBottom: 12 }}>
                Scan this QR with your authenticator app, or enter the secret manually.
              </p>
              <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start', marginBottom: 14 }}>
                <div
                  style={{ background: 'white', padding: 8, borderRadius: 6, width: 200, height: 200,
                           display: 'flex', alignItems: 'center', justifyContent: 'center' }}
                  dangerouslySetInnerHTML={{ __html: qrSvg || '<span style="color:#999;font-size:11px">QR loading…</span>' }}
                />
                <div style={{ flex: 1 }}>
                  <div style={{ color: 'var(--ink-3)', fontSize: 11, marginBottom: 4 }}>Secret</div>
                  <code style={{
                    display: 'block', padding: '6px 10px', background: 'var(--surface-2)',
                    border: '1px solid var(--border)', borderRadius: 6,
                    fontFamily: 'IBM Plex Mono, monospace', fontSize: 12,
                    wordBreak: 'break-all', userSelect: 'all', marginBottom: 12,
                  }}>{setup.secret}</code>
                  <div style={{ color: 'var(--ink-3)', fontSize: 11, marginBottom: 4 }}>Confirm with current code</div>
                  <input
                    value={code} onChange={(e) => setCode(e.target.value)}
                    placeholder="123456" inputMode="numeric" maxLength={8}
                    style={{
                      width: '100%', padding: '8px 10px', fontFamily: 'IBM Plex Mono, monospace',
                      background: 'var(--bg)', border: '1px solid var(--border)',
                      borderRadius: 6, color: 'var(--ink)', fontSize: 14,
                    }}
                  />
                </div>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="add-subtask" onClick={enable} disabled={busy || code.length < 6}>Enable</button>
                <button className="add-subtask" onClick={() => setSetup(null)}>Cancel</button>
              </div>
            </>
          )}

          {enabled === true && (
            <>
              <p style={{ color: 'var(--success)', fontSize: 13, marginBottom: 14 }}>
                ✓ 2FA is enabled on your account.
              </p>
              <p style={{ color: 'var(--ink-3)', fontSize: 12, marginBottom: 8 }}>
                To disable, enter a current code from your authenticator:
              </p>
              <input
                value={code} onChange={(e) => setCode(e.target.value)}
                placeholder="123456" inputMode="numeric" maxLength={8}
                style={{
                  width: '100%', padding: '8px 10px', fontFamily: 'IBM Plex Mono, monospace',
                  background: 'var(--bg)', border: '1px solid var(--border)',
                  borderRadius: 6, color: 'var(--ink)', fontSize: 14, marginBottom: 12,
                }}
              />
              <button className="add-subtask" onClick={disable} disabled={busy || code.length < 6}>Disable 2FA</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function BackupsModal({ onClose, onRestore }) {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const toast = (m) => { try { window.__taskboardToast?.(m); } catch (e) {} };

  const refresh = async () => {
    setLoading(true);
    try {
      const r = await fetch('/api/backups', { cache: 'no-store' });
      if (r.ok) setList(await r.json());
    } catch (e) {}
    setLoading(false);
  };
  useEffect(() => { refresh(); }, []);

  const restore = async (id) => {
    if (!confirm('Replace current state with this snapshot? Local changes will be overwritten.')) return;
    try {
      const r = await fetch(`/api/backups/${id}`);
      if (!r.ok) { toast('Restore failed'); return; }
      const j = await r.json();
      if (j && j.data && Array.isArray(j.data.projects)) {
        onRestore(j.data);
        toast(`Restored snapshot #${id}`);
        onClose();
      }
    } catch (e) { toast('Restore failed'); }
  };

  const remove = async (id) => {
    if (!confirm('Delete this snapshot?')) return;
    try {
      const r = await fetch(`/api/backups/${id}`, { method: 'DELETE' });
      if (r.ok) { toast('Snapshot deleted'); refresh(); }
    } catch (e) {}
  };

  const fmtSize = (n) => n < 1024 ? `${n} B` : n < 1024*1024 ? `${(n/1024).toFixed(1)} KB` : `${(n/1024/1024).toFixed(1)} MB`;

  return (
    <div className="palette-overlay" onClick={onClose}>
      <div className="palette" style={{ width: 640 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={{ fontWeight: 600, color: 'var(--ink)' }}>Server snapshots</div>
          <button className="icon-btn" onClick={onClose}><Icon.X size={14}/></button>
        </div>
        <div style={{ maxHeight: '60vh', overflowY: 'auto', padding: 6 }}>
          {loading && <div style={{ padding: 16, color: 'var(--ink-3)' }}>Loading…</div>}
          {!loading && list.length === 0 && <div style={{ padding: 16, color: 'var(--ink-3)' }}>No snapshots yet. Use the command palette: "Save snapshot to server".</div>}
          {list.map(b => (
            <div key={b.id} style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '10px 14px', borderRadius: 8,
            }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ color: 'var(--ink)', fontSize: 13.5 }}>
                  #{b.id} · {new Date(b.created_at).toLocaleString()}
                </div>
                <div style={{ color: 'var(--ink-3)', fontSize: 11, fontFamily: 'IBM Plex Mono, monospace' }}>
                  {b.source} · {fmtSize(b.size)}{b.note ? ` · ${b.note}` : ''}
                </div>
              </div>
              <button className="add-subtask" onClick={() => restore(b.id)}>Restore</button>
              <button className="icon-btn" onClick={() => remove(b.id)}><Icon.Trash size={13}/></button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function TaskRow({ task, project, expanded, onToggleExpand, onUpdate, onDelete, dragHandlers, dropClass }) {
  const due = formatDueDate(task.dueDate);
  const subProgress = task.subtasks.length > 0
    ? task.subtasks.filter(s => s.done).length / task.subtasks.length
    : 0;
  const subDoneCount = task.subtasks.filter(s => s.done).length;
  const newSubRef = useRef(null);

  const toggleComplete = (e) => {
    e.stopPropagation();
    onUpdate({ ...task, completed: !task.completed });
  };

  const updateField = (k, v) => onUpdate({ ...task, [k]: v });

  const addSubtask = () => {
    const newSt = { id: uid(), title: '', done: false };
    onUpdate({ ...task, subtasks: [...task.subtasks, newSt] });
    setTimeout(() => {
      const inputs = document.querySelectorAll(`[data-task-id="${task.id}"] .subtask-input`);
      const last = inputs[inputs.length - 1];
      if (last) last.focus();
    }, 50);
  };

  const updateSubtask = (sid, patch) => {
    onUpdate({
      ...task,
      subtasks: task.subtasks.map(s => s.id === sid ? { ...s, ...patch } : s),
    });
  };
  const deleteSubtask = (sid) => {
    onUpdate({ ...task, subtasks: task.subtasks.filter(s => s.id !== sid) });
  };

  return (
    <div
      className={`task ${task.completed ? 'completed' : ''} ${expanded ? 'expanded' : ''} ${dropClass || ''}`}
      data-task-id={task.id}
      draggable={dragHandlers ? true : undefined}
      onDragStart={dragHandlers?.onDragStart}
      onDragOver={dragHandlers?.onDragOver}
      onDragLeave={dragHandlers?.onDragLeave}
      onDrop={dragHandlers?.onDrop}
      onDragEnd={dragHandlers?.onDragEnd}
    >
      <div className="task-row" onClick={onToggleExpand}>
        <button className={`task-checkbox ${task.completed ? 'checked' : ''}`} onClick={toggleComplete}>
          <Icon.Check size={12}/>
        </button>
        <div className="task-main">
          {expanded ? (
            <input
              className="task-title-input"
              value={task.title}
              onChange={(e) => updateField('title', e.target.value)}
              onClick={(e) => e.stopPropagation()}
              placeholder="Task title"
            />
          ) : (
            <div className="task-title">{task.title || <span style={{ color: 'var(--ink-4)' }}>Untitled task</span>}</div>
          )}
          <div className="task-meta">
            {project && (
              <span className="task-meta-item">
                <span className="priority-dot" style={{ background: project.color }}/>
                {project.name}
              </span>
            )}
            {task.priority && task.priority !== 'none' && (
              <span className="task-meta-item">
                <span className={`priority-dot priority-${task.priority}`}/>
                {task.priority === 'high' ? 'High' : task.priority === 'med' ? 'Medium' : 'Low'}
              </span>
            )}
            {due && (
              <span className={`task-meta-item ${task.completed ? 'completed-meta' : due.state}`}>
                <Icon.Calendar/> {due.label}

            {task.subtasks.length > 0 && (

              <span className="task-meta-item recur-badge">
                <Icon.Repeat/> {recurLabel(task.recur)}

        </div>
        <div className="task-actions" onClick={(e) => e.stopPropagation()}>
          <button className="icon-btn" title="Delete task" onClick={onDelete}><Icon.Trash size={13}/></button>
        </div>
        <span className="expand-chevron"><Icon.Chevron/></span>
      </div>

      {expanded && (
        <div className="task-body">
          <div className="body-section">
            <div className="meta-row">
              <label className="field">
                <span className="field-icon"><Icon.Calendar/></span>
                <input
                  type="date"

                  <button className="icon-btn" style={{ width: 16, height: 16 }} onClick={() => updateField('dueDate', '')} title="Clear date"><Icon.X size={10}/></button>
                )}

              <label className="field">
                <span className="field-icon"><Icon.Flag/></span>
                <select
                  className="field-select"
                  value={task.priority || 'none'}

                <select
